<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>English Adventures — Learn. Play. Speak. Explore!</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#1a3a6e;
    font-family:'Baloo 2','Nunito',Arial,sans-serif;-webkit-tap-highlight-color:transparent;}
  #stage{position:fixed;inset:0;overflow:hidden;background:#1a3a6e;}
  #bgBackdrop{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;
    display:block;filter:blur(35px) brightness(.75) saturate(1.1);transform:scale(1.15);}
  #bgImg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;display:block;}
  #layer{position:absolute;inset:0;}

  .px{position:absolute;}
  .hotspot{border:none;padding:0;margin:0;background:rgba(255,255,255,0);cursor:pointer;
    -webkit-tap-highlight-color:transparent;border-radius:12%;transition:background .12s ease,transform .1s ease;}
  .hotspot:active{background:rgba(255,255,255,.28);transform:scale(.96);}
  @media (hover:hover){ .hotspot:hover{background:rgba(255,255,255,.16);} }
  .hotspot:focus-visible{outline:3px solid #fff;outline-offset:2px;}

  .overlay{pointer-events:none;display:flex;align-items:center;justify-content:center;}
  .patch{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.15);}
  .patch.transparent-bg{background:transparent;box-shadow:none;}
  .txt{font-weight:800;color:#1E3A6E;text-align:center;line-height:1.15;white-space:nowrap;}
  .txt.light{color:#fff;}
  .stars-row{letter-spacing:.1em;color:#E3ECFB;}
  .stars-row .on{color:#F59E0B;}
  .lock-emoji{filter:none;}

  .card-btn{background:#fff;border:2px solid rgba(30,58,110,.12);border-radius:14%;cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2%;
    font-weight:800;color:#1E3A6E;text-align:center;padding:2%;-webkit-tap-highlight-color:transparent;
    transition:transform .1s ease,box-shadow .12s ease;}
  .card-btn:active{transform:scale(.95);}
  @media (hover:hover){ .card-btn:hover{box-shadow:0 6px 14px rgba(0,0,0,.18);transform:translateY(-2px);} }
  .card-btn.correct{background:#DCFCE7;border-color:#16A34A;}
  .card-btn.wrong{background:#FEE2E2;border-color:#DC2626;animation:shake .3s;}
  .card-btn.sel{border-color:#F59E0B;background:#FEF3C7;}
  .card-btn.done{border-color:#16A34A;background:#DCFCE7;opacity:.7;cursor:default;}
  .card-btn:disabled{opacity:.3;cursor:default;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
  @keyframes popIn{0%{opacity:0;transform:scale(.6);}70%{opacity:1;transform:scale(1.06);}100%{transform:scale(1);}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  #bgImg{animation:fadeIn .35s ease;}

  .fb-line{font-weight:800;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.5);text-align:center;
    pointer-events:none;}

  #loadingOverlay{position:fixed;inset:0;background:linear-gradient(180deg,#7EC8F2,#CDEFFF 60%);
    display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:500;}
  #loadingOverlay.show{display:flex;}
  #loadingOverlay img{width:15vw;max-width:110px;min-width:70px;animation:buddyIdle 1s ease-in-out infinite;}
  #loadingOverlay .txt2{font-weight:700;color:#1E3A6E;font-size:4vw;max-font-size:18px;}
  @keyframes buddyIdle{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}

  .toast{position:fixed;left:50%;bottom:6%;transform:translateX(-50%) translateY(20px);
    background:rgba(10,25,55,.92);color:#fff;padding:12px 22px;border-radius:24px;font-weight:800;
    font-size:clamp(13px,2.4vw,17px);box-shadow:0 8px 24px rgba(0,0,0,.35);opacity:0;
    transition:opacity .25s ease,transform .25s ease;pointer-events:none;z-index:600;text-align:center;
    max-width:88vw;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .modal-overlay{position:fixed;inset:0;background:rgba(10,20,40,.55);display:none;align-items:center;
    justify-content:center;z-index:400;padding:16px;}
  .modal-overlay.show{display:flex;}
  .settings-card{background:#fff;border-radius:20px;padding:20px;max-width:320px;width:100%;
    box-shadow:0 20px 50px rgba(0,0,0,.35);position:relative;animation:popIn .25s ease;}
  .settings-card h2{font-size:18px;color:#1E3A6E;margin:0 0 12px;}
  .settings-card button{display:block;width:100%;background:#EAF6FF;border:1px solid #E3ECFB;
    border-radius:12px;padding:12px 14px;font-weight:800;color:#1E3A6E;font-size:13.5px;cursor:pointer;
    text-align:left;margin-bottom:8px;font-family:inherit;}
  .settings-card .close-x{position:absolute;top:10px;right:12px;background:none;border:none;
    font-size:18px;color:#64748B;cursor:pointer;}
</style>
</head>

/* ---------------- STATE ---------------- */
var STATE = null;
function todayStr(){ return new Date().toISOString().slice(0,10); }
function defaultState(){
  return {
    name:'Explorer', stars:0, gems:0, trophies:0,
    lessons:{}, wordsLearned:[], timeMinutes:0,
    skills:{listening:1, speaking:1, vocabulary:1},
    soundOn:true,
    dailyMissions:{date:todayStr(), lessons:0, stars:0, speak:0, games:0, chestClaimed:false}
  };
}
function loadState(){
  try{
    var raw = localStorage.getItem('ea_state_v2');
    STATE = raw ? JSON.parse(raw) : defaultState();
  }catch(e){ STATE = defaultState(); }
  if(!STATE.lessons) STATE.lessons = {};
  if(!STATE.wordsLearned) STATE.wordsLearned = [];
  if(!STATE.skills) STATE.skills = {listening:1,speaking:1,vocabulary:1};
  if(!STATE.dailyMissions) STATE.dailyMissions = {date:todayStr(), lessons:0, stars:0, speak:0, games:0, chestClaimed:false};
  ensureDailyMissions();
}
function saveState(){ try{ localStorage.setItem('ea_state_v2', JSON.stringify(STATE)); }catch(e){} }
function ensureDailyMissions(){
  if(STATE.dailyMissions.date !== todayStr()){
    STATE.dailyMissions = {date:todayStr(), lessons:0, stars:0, speak:0, games:0, chestClaimed:false};
    saveState();
  }
}
function missionsAllDone(){
  var m = STATE.dailyMissions;
  return m.lessons>=1 && m.stars>=20 && m.speak>=1 && m.games>=2;
}
function trackMission(kind, amount){
  ensureDailyMissions();
  STATE.dailyMissions[kind] += (amount||1);
  saveState();
}
function lessonsDoneCount(){
  var n=0; for(var i=1;i<=5;i++){ if(STATE.lessons[i] && STATE.lessons[i].done) n++; } return n;
}
function nextLessonNum(){
  for(var i=1;i<=5;i++){ if(!STATE.lessons[i] || !STATE.lessons[i].done) return i; }
  return null;
}

/* ---------------- STAGE / LAYOUT ENGINE ---------------- */
var NAT = {w:466,h:256};
var bgBackdrop, bgImg, layerEl;
function setBg(src, dims){
  bgBackdrop.src = src; bgImg.src = src;
  NAT.w = dims[0]; NAT.h = dims[1];
}
function clearLayer(){ layerEl.innerHTML = ''; }
function px(el, fx, fy, fw, fh){
  el.classList.add('px');
  el.dataset.fx=fx; el.dataset.fy=fy; el.dataset.fw=fw; el.dataset.fh=fh;
  layerEl.appendChild(el);
  return el;
}
function hotspot(fx,fy,fw,fh,label,onclick){
  var b = document.createElement('button');
  b.className = 'hotspot';
  b.setAttribute('aria-label', label||'');
  b.onclick = onclick;
  return px(b, fx,fy,fw,fh);
}
function overlay(fx,fy,fw,fh,innerHtml,extraClass){
  var d = document.createElement('div');
  d.className = 'overlay '+(extraClass||'');
  d.innerHTML = innerHtml;
  return px(d, fx,fy,fw,fh);
}
function layoutAll(){
  var vw = window.innerWidth, vh = window.innerHeight;
  var scale = Math.min(vw/NAT.w, vh/NAT.h);
  var dw = NAT.w*scale, dh = NAT.h*scale, offX=(vw-dw)/2, offY=(vh-dh)/2;
  document.querySelectorAll('.px').forEach(function(el){
    var fx=+el.dataset.fx, fy=+el.dataset.fy, fw=+el.dataset.fw, fh=+el.dataset.fh;
    el.style.left=(offX+fx*NAT.w*scale)+'px';
    el.style.top=(offY+fy*NAT.h*scale)+'px';
    el.style.width=(fw*NAT.w*scale)+'px';
    el.style.height=(fh*NAT.h*scale)+'px';
    el.style.fontSize=(Math.max(9,10*scale))+'px';
  });
}
window.addEventListener('resize', layoutAll);
window.addEventListener('orientationchange', layoutAll);

function trySpeak(phrase){
  var Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  var done=false;
  function finish(msg){ if(done) return; done=true; toast(msg); trackMission('speak',1); setTimeout(advanceStep, 1300); }
  if(!Rec){ finish('✅ I said it! Great job!'); return; }
  try{
    var rec = new Rec();
    rec.lang='en-US'; rec.interimResults=false; rec.maxAlternatives=1;
    var giveUp = setTimeout(function(){ try{ rec.stop(); }catch(e){} finish('✅ I said it! Great job!'); }, 6000);
    rec.onresult=function(e){
      clearTimeout(giveUp);
      var said = e.results[0][0].transcript.toLowerCase();
      var target = phrase.toLowerCase().replace(/[^a-z ]/g,'');
      var ok = said.indexOf(target.split(' ')[0])!==-1 || target.indexOf(said.split(' ')[0])!==-1;
      finish(ok?'Great pronunciation! ⭐':randomFrom(TRY_AGAIN_MSGS));
    };
    rec.onerror=function(){ clearTimeout(giveUp); finish('✅ I said it! Great job!'); };
    rec.start();
  }catch(err){ finish('✅ I said it! Great job!'); }
}

function finishLesson(){

  var wasNew = !(STATE.lessons[L.num] && STATE.lessons[L.num].done);
  STATE.lessons[L.num] = {done:true, stars:3};
  if(wasNew){
    STATE.stars += L.reward.stars;
    STATE.timeMinutes += 25;
    L.vocab.forEach(function(v){ if(STATE.wordsLearned.indexOf(v.word)===-1) STATE.wordsLearned.push(v.word); });
    STATE.skills.listening = Math.min(5, STATE.skills.listening+1);
    STATE.skills.speaking = Math.min(5, STATE.skills.speaking+1);
    STATE.skills.vocabulary = Math.min(5, STATE.skills.vocabulary+1);
    if(lessonsDoneCount()===5){ STATE.trophies += 1; STATE.gems += 10; }
    trackMission('lessons',1); trackMission('stars', L.reward.stars);
  }
  saveState();
  showCert(L, function(){
    if(lessonsDoneCount()===5 && L.num===5){ renderMissaoEspecial(); }
    else { renderLessonSelect(); }
  });
}

/* ---------------- SHOP / LOJA ---------------- */
var SKIN_UNLOCKS = [
  {id:'classic', fx:0.005,fy:0.10,fw:0.235,fh:0.85, need:0},
  {id:'astro',   fx:0.245,fy:0.10,fw:0.245,fh:0.85, need:20},
  {id:'surfer',  fx:0.50, fy:0.10,fw:0.245,fh:0.85, need:40},
  {id:'ninja',   fx:0.755,fy:0.10,fw:0.245,fh:0.85, need:60}
];
function renderLoja(){
  CURRENT='loja';
  setBg(IMG.loja, DIM.loja);
  clearLayer();
  hotspot(0.0,0.0,0.999,0.999,'', renderHome);
  SKIN_UNLOCKS.forEach(function(sk){
    var unlocked = STATE.stars >= sk.need;
    var equipped = (STATE.buddySkin||'classic') === sk.id;
    if(!unlocked){
      overlay(sk.fx,sk.fy,sk.fw,sk.fh,'<div style="width:100%;height:100%;background:rgba(20,30,50,.55);border-radius:8%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4%"><span style="font-size:2em">🔒</span><b class="txt light" style="font-size:.5em">'+sk.need+' ⭐</b></div>');
    } else if(equipped){
      overlay(sk.fx,sk.fy,sk.fw,sk.fh,'<div style="width:100%;height:100%;border:4px solid #16A34A;border-radius:8%;box-sizing:border-box;display:flex;align-items:flex-end;justify-content:center;padding-bottom:3%"><span style="font-size:1.3em;background:#16A34A;color:#fff;border-radius:50%;padding:2%">✓</span></div>');
    }
    hotspot(sk.fx,sk.fy,sk.fw,sk.fh,sk.id, function(id,ok){ return function(){
      if(!ok){ toast('Earn more ⭐ to unlock!'); return; }
      STATE.buddySkin=id; saveState(); toast('Buddy is ready! 🎉'); renderLoja();
    };}(sk.id, unlocked));
  });
  layoutAll();
}

/* ---------------- DAILY MISSIONS ---------------- */
function renderDesafios(){
  CURRENT='desafios';
  ensureDailyMissions();
  setBg(IMG.desafios, DIM.desafios);
  clearLayer();
  hotspot(0.0,0.0,0.999,0.11,'Back', renderMap);
  var m = STATE.dailyMissions;
  var rows = [
    {y:0.10, have:m.lessons, need:1},
    {y:0.37, have:m.stars, need:20},
    {y:0.63, have:m.speak, need:1}
  ];
  rows.forEach(function(r){
    var pct = Math.min(100, Math.round((r.have/r.need)*100));
    overlay(0.565,r.y+0.075,0.13,0.09,'<div class="patch" style="width:100%;height:100%;border-radius:20%;display:flex;align-items:center;justify-content:center"><b class="txt" style="font-size:.55em">'+Math.min(r.have,r.need)+'/'+r.need+'</b></div>');
    overlay(0.06,r.y+0.175,0.55,0.028,'<div style="width:100%;height:100%;background:rgba(255,255,255,.25);border-radius:6px;overflow:hidden"><div style="width:'+pct+'%;height:100%;background:#22C55E"></div></div>');
  });
  if(missionsAllDone() && !m.chestClaimed){
    hotspot(0.68,0.80,0.28,0.18,'Claim reward', function(){ renderChest(true); });
  } else {
    hotspot(0.68,0.80,0.28,0.18,'Claim reward', function(){ toast(m.chestClaimed?'Come back tomorrow!':'Complete every mission first!'); });
  }
  layoutAll();
}

/* ---------------- AUDIO / TTS ---------------- */
var _voice = null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  var voices = window.speechSynthesis.getVoices();
  _voice = voices.find(function(v){ return /en-US/i.test(v.lang); }) || voices.find(function(v){ return /^en/i.test(v.lang); }) || null;
}
if('speechSynthesis' in window){ window.speechSynthesis.onvoiceschanged = pickVoice; pickVoice(); }
function speakText(text){
  if(!STATE.soundOn || !('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=0.92; u.pitch=1.05;
    if(_voice) u.voice=_voice;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------------- UTIL ---------------- */
function shuffle(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var toastTimer=null;
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ t.classList.remove('show'); }, 2000);
}
