<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>English Adventures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --sky-top:#8FD3F4; --sky-bot:#C9ECFF;
  --navy:#173A66; --navy-2:#1F4E8C;
  --green:#22C55E; --green-d:#15803D;
  --yellow:#FBBF24; --orange:#F59E0B;
  --white:#FFFFFF; --text:#1E2A44; --muted:#5B6B8C;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;width:100%;min-height:100%;overflow-x:hidden;
  font-family:'Nunito',Arial,sans-serif;-webkit-tap-highlight-color:transparent;}
h1,h2,.headline{font-family:'Baloo 2',cursive;}
body{
  background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bot) 55%,#DFF6E8 100%);
  min-height:100vh;display:flex;flex-direction:column;position:relative;
}
button{font-family:inherit;}

/* soft decorative clouds */
.cloud{position:absolute;background:#fff;border-radius:50%;opacity:.75;filter:blur(1px);pointer-events:none;}

#app{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;max-width:1400px;margin:0 auto;
  width:100%;padding:18px 20px 30px;}

/* ---------- Top bar ---------- */
#topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:6px;}
#logo{height:78px;width:auto;filter:drop-shadow(0 4px 8px rgba(20,60,120,.25));}
.stat-cluster{display:flex;align-items:center;gap:10px;}
.buddy-avatar{width:52px;height:52px;border-radius:50%;background:#2E8FE0;border:3px solid #fff;
  box-shadow:0 3px 10px rgba(20,60,120,.3);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
.buddy-avatar img{width:78%;height:auto;}
.stat-pill{display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,#2E6FD9,#1F4E9C);
  border:2px solid rgba(255,255,255,.35);border-radius:30px;padding:8px 20px;box-shadow:0 4px 12px rgba(20,60,120,.3);}
.stat-pill .s{display:flex;align-items:center;gap:6px;font-weight:900;color:#fff;font-size:18px;}
.stat-pill .s .ic{font-size:20px;}
.icon-btn{width:52px;height:52px;border-radius:50%;border:2px solid rgba(255,255,255,.4);cursor:pointer;
  background:linear-gradient(180deg,#2E6FD9,#1F4E9C);color:#fff;font-size:22px;box-shadow:0 4px 12px rgba(20,60,120,.3);
  display:flex;align-items:center;justify-content:center;transition:transform .15s ease;flex-shrink:0;}
.icon-btn:hover{animation:nudge .5s ease;}
.icon-btn:active{transform:scale(.9);}

/* ---------- Main content: stage (characters) + nav grid ---------- */
#main{flex:1;display:grid;grid-template-columns:1.55fr 1fr;gap:22px;align-items:start;margin-top:18px;min-width:0;}
@media(max-width:860px){ #main{grid-template-columns:1fr;} }

#stage{position:relative;min-width:0;min-height:380px;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-end;padding-bottom:6px;}
.cast{position:relative;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:1.5%;min-height:200px;}
.cast img{position:relative;height:auto;width:20%;max-width:230px;min-width:60px;object-fit:contain;
  filter:drop-shadow(0 10px 14px rgba(10,30,60,.28));}
.cast .c-leo{z-index:2;opacity:0;animation:slideInRight .6s ease .15s forwards;}
.cast .c-mia{z-index:3;opacity:0;transform-origin:bottom center;animation:popIn .55s cubic-bezier(.34,1.56,.64,1) .35s forwards;}
.cast .c-buddy{z-index:4;width:24%;max-width:250px;opacity:0;animation:walkIn .7s ease .5s forwards;}
.cast .c-luna{z-index:2;opacity:0;animation:slideInLeft .6s ease .25s forwards;}

@keyframes slideInRight{from{opacity:0;transform:translateX(60px);}to{opacity:1;transform:translateX(0);}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-60px);}to{opacity:1;transform:translateX(0);}}
@keyframes popIn{from{opacity:0;transform:scale(.4) translateY(30px);}to{opacity:1;transform:scale(1) translateY(0);}}
@keyframes walkIn{from{opacity:0;transform:translateY(40px) scale(.85);}to{opacity:1;transform:translateY(0) scale(1);}}

.idle-breathe{animation:breathe 2.6s ease-in-out infinite;}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-4px) scale(1.015);}}

.speech-row{display:flex;align-items:center;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:6px;width:100%;}
.speech-bubble{background:#fff;border-radius:20px;padding:14px 20px;box-shadow:0 6px 16px rgba(20,60,120,.18);
  max-width:min(420px,100%);box-sizing:border-box;position:relative;opacity:0;animation:fadeUp .5s ease .9s forwards;}
.speech-bubble:after{content:"";position:absolute;left:-10px;bottom:18px;border-width:8px 12px 8px 0;
  border-style:solid;border-color:transparent #fff transparent transparent;}
.speech-bubble b{display:block;font-size:16px;color:var(--navy);font-family:'Baloo 2';margin-bottom:2px;}
.speech-bubble span{font-size:13px;color:var(--muted);}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

.cta-wrap{display:flex;justify-content:center;margin-top:16px;opacity:0;animation:fadeUp .5s ease 1.1s forwards;}
.cta-btn{border:none;cursor:pointer;padding:0;background:none;transition:transform .15s ease;}
.cta-btn img{height:66px;width:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.28));display:block;}
.cta-btn:hover{animation:nudge .55s ease;}
.cta-btn:active{transform:scale(.93);}

@keyframes nudge{
  0%{transform:scale(1) rotate(0deg);}
  20%{transform:scale(1.08) rotate(-3deg);}
  45%{transform:scale(1.1) rotate(3deg);}
  70%{transform:scale(1.06) rotate(-1.5deg);}
  100%{transform:scale(1.06) rotate(0deg);}
}
.buddy-cheer{animation:cheer .6s ease;}
@keyframes cheer{
  0%{transform:translateY(0) scale(1) rotate(0deg);}
  30%{transform:translateY(-22px) scale(1.08) rotate(-6deg);}
  55%{transform:translateY(-30px) scale(1.1) rotate(6deg);}
  75%{transform:translateY(-8px) scale(1.04) rotate(-3deg);}
  100%{transform:translateY(0) scale(1) rotate(0deg);}
}

/* ---------- Nav grid ---------- */
#navgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-content:start;min-width:0;}
@media(max-width:640px){ #navgrid{grid-template-columns:repeat(2,1fr);} }
.nav-btn{border:none;background:none;cursor:pointer;padding:0;border-radius:20px;transition:transform .15s ease;
  opacity:0;animation:fadeUp .45s ease forwards;}
.nav-btn img{width:100%;height:auto;display:block;filter:drop-shadow(0 5px 10px rgba(20,60,120,.25));}
.nav-btn:hover{animation:nudge .5s ease, fadeUp .45s ease forwards;}
.nav-btn:active{transform:scale(.93);}
.nav-btn:nth-child(1){animation-delay:.05s;} .nav-btn:nth-child(2){animation-delay:.1s;}
.nav-btn:nth-child(3){animation-delay:.15s;} .nav-btn:nth-child(4){animation-delay:.2s;}
.nav-btn:nth-child(5){animation-delay:.25s;} .nav-btn:nth-child(6){animation-delay:.3s;}
.nav-btn:nth-child(7){animation-delay:.35s;} .nav-btn:nth-child(8){animation-delay:.4s;}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:5%;transform:translateX(-50%) translateY(20px);
  background:rgba(10,25,55,.94);color:#fff;padding:13px 24px;border-radius:26px;font-weight:800;
  font-size:clamp(13px,2vw,16px);box-shadow:0 10px 26px rgba(0,0,0,.35);opacity:0;
  transition:opacity .25s ease,transform .25s ease;pointer-events:none;z-index:80;max-width:90%;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>

<div class="toast" id="toast"></div>

<script>
/* ---------------- STATE ---------------- */
var STATE = null;
function loadState(){
  try{ STATE = JSON.parse(localStorage.getItem('ea_home_v2')) || {}; }catch(e){ STATE = {}; }
  if(typeof STATE.stars !== 'number') STATE.stars = 0;
  if(typeof STATE.gems !== 'number') STATE.gems = 0;
  if(typeof STATE.soundOn !== 'boolean') STATE.soundOn = true;
}
function saveState(){ try{ localStorage.setItem('ea_home_v2', JSON.stringify(STATE)); }catch(e){} }
loadState();
document.getElementById('stStars').textContent = STATE.stars;
document.getElementById('stGems').textContent = STATE.gems;
document.getElementById('soundBtn').textContent = STATE.soundOn ? '🔊' : '🔇';

/* ---------------- SOUND (short synthesized blips, no audio files needed) ---------------- */
var actx = null;
function getCtx(){
  if(!actx){ try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} }
  return actx;
}
function beep(freq, dur, type, vol){
  if(!STATE.soundOn) return;
  var ctx = getCtx(); if(!ctx) return;
  try{
    var osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = type || 'sine'; osc.frequency.value = freq;
    gain.gain.setValueAtTime((vol||0.12), ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + dur);
  }catch(e){}
}
function clickSound(){ beep(720, .09, 'triangle', .1); }
function cheerSound(){ beep(523, .1, 'sine', .12); setTimeout(function(){ beep(784, .16, 'sine', .12); }, 90); }
function toggleSound(){
  STATE.soundOn = !STATE.soundOn; saveState();
  document.getElementById('soundBtn').textContent = STATE.soundOn ? '🔊' : '🔇';
  if(STATE.soundOn) clickSound();
}

/* ---------------- BUDDY IDLE LOOP ---------------- */
var buddyCast = document.getElementById('buddyCast');
setTimeout(function(){ buddyCast.classList.add('idle-breathe'); }, 1300);

/* ---------------- INTERACTIONS ---------------- */
var toastTimer = null;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}
function notReady(label){
  clickSound();
  toast(label + ' — em construção! Aprovando a Home antes de seguir. 🚧');
}
function onLetsGo(){
  clickSound();
  buddyCast.classList.remove('idle-breathe');
  buddyCast.classList.add('buddy-cheer');
  setTimeout(function(){
    cheerSound();
  }, 80);
  document.getElementById('buddyLine').textContent = "Yes! Let's explore together!";
  setTimeout(function(){
    buddyCast.classList.remove('buddy-cheer');
    buddyCast.classList.add('idle-breathe');
  }, 650);
  toast("🗺️ Próxima tela: Mapa dos Mundos — em construção! Aprovando a Home primeiro.");
}
</script>
