<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>English Adventures</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#1a3a6e;
    font-family:'Nunito',Arial,sans-serif;-webkit-tap-highlight-color:transparent;}
  #stage{position:fixed;inset:0;overflow:hidden;}
  #bgImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block;}

  .hotspot{position:absolute;border:none;padding:0;margin:0;background:none;cursor:pointer;
    -webkit-tap-highlight-color:transparent;}
  .btn-art{width:100%;height:100%;display:block;object-fit:contain;filter:drop-shadow(0 3px 6px rgba(0,0,0,.25));
    transition:transform .16s ease,filter .16s ease;transform-origin:50% 55%;}

  .hotspot:hover .btn-art{filter:drop-shadow(0 8px 14px rgba(0,0,0,.4));animation:nudge .55s ease;}
  .hotspot:active .btn-art{transform:scale(.92) !important;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3));}
  .hotspot:focus-visible .btn-art{outline:3px solid #fff;outline-offset:3px;border-radius:14px;}

  @keyframes nudge{
    0%{transform:scale(1) rotate(0deg);}
    20%{transform:scale(1.1) rotate(-4deg);}
    45%{transform:scale(1.12) rotate(3deg);}
    70%{transform:scale(1.08) rotate(-2deg);}
    100%{transform:scale(1.08) rotate(0deg);}
  }
  .hs-gear .btn-art{transform-origin:50% 50%;}
  .hs-gear:hover .btn-art{animation:gearspin .5s ease;}
  @keyframes gearspin{
    0%{transform:scale(1) rotate(0deg);}
    100%{transform:scale(1.15) rotate(50deg);}
  }

  .toast{position:fixed;left:50%;bottom:6%;transform:translateX(-50%) translateY(20px);
    background:rgba(10,25,55,.92);color:#fff;padding:12px 22px;border-radius:24px;font-weight:800;
    font-size:clamp(13px,2vw,16px);box-shadow:0 8px 24px rgba(0,0,0,.35);opacity:0;
    transition:opacity .25s ease,transform .25s ease;pointer-events:none;z-index:50;white-space:nowrap;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>

<div class="toast" id="toast"></div>

<script>
var NATURAL_W = 466, NATURAL_H = 256;
var img = document.getElementById('bgImg');
var hotspots = Array.prototype.slice.call(document.querySelectorAll('.hotspot'));

function layout(){
  var vw = window.innerWidth, vh = window.innerHeight;
  var scale = Math.max(vw / NATURAL_W, vh / NATURAL_H);
  var drawW = NATURAL_W * scale, drawH = NATURAL_H * scale;
  var offX = (vw - drawW) / 2, offY = (vh - drawH) / 2;
  hotspots.forEach(function(el){
    var x = parseFloat(el.getAttribute('data-x'));
    var y = parseFloat(el.getAttribute('data-y'));
    var w = parseFloat(el.getAttribute('data-w'));
    var h = parseFloat(el.getAttribute('data-h'));
    el.style.left = (offX + x * scale) + 'px';
    el.style.top = (offY + y * scale) + 'px';
    el.style.width = (w * scale) + 'px';
    el.style.height = (h * scale) + 'px';
  });
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', layout);
if (img.complete) { layout(); } else { img.addEventListener('load', layout); }
layout();

var toastTimer = null;
function go(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1800);
}
</script>
