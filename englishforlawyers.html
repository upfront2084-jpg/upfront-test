<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<!-- Portal: hide page until the session check (GET /me.php) resolves, to avoid a gate flash -->
<script>document.documentElement.style.visibility='hidden';</script>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English for Lawyers — Curso Completo</title>
<!-- No external font/CDN links on purpose: this course must work with zero internet access.
     Typeface is Arial (with system sans-serif fallback), used consistently everywhere. -->
<style>
  :root{
    --ink:#07162F; --paper:#F7F9FC; --paper-2:#EEF2FA;
    --blue:#000000; --cyan:#2DD4BF; --coral:#EF4444; --purple:#6C63FF; --warning:#F59E0B;
    --text:#1F2937; --muted:#667085; --line:#E2E8F0;
    --navy-bg:#07162F; --navy-surface:#146C43; --navy-surface-2:#1B5B39;
    --navy-border:rgba(255,255,255,0.08); --navy-text:#EDEFF4; --navy-muted:rgba(237,239,244,0.6);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ink);color:var(--text);font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;}
  ::selection{background:var(--blue);color:#fff;}
  #app{display:flex;min-height:100vh;}
  #sidebar{width:350px;min-width:350px;background:#0B3D24;color:#EDEFF4;padding:26px 18px 40px;
    position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid rgba(255,255,255,0.08);}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:2px;}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--blue);}
  .brand-logo{width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0;
    border:2px solid rgba(255,255,255,0.4);}
  .brand h1{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:19px;font-weight:700;margin:0;}
  .brand-school{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:10px;font-weight:700;color:#fff;
    letter-spacing:1.5px;text-transform:uppercase;margin:2px 0 2px 46px;}
  .brand-sub{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:10.5px;color:#fff;font-weight:700;letter-spacing:1.5px;
    text-transform:uppercase;margin:2px 0 20px 46px;}
  .level-tabs{display:flex;gap:6px;margin-bottom:6px;}
  .level-tab{flex:1;text-align:center;padding:9px 0;border-radius:6px;font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
    font-size:12.5px;font-weight:600;cursor:pointer;border:1px solid rgba(255,255,255,0.15);
    color:rgba(255,255,255,0.6);transition:all .15s ease;background:transparent;}
  .level-tab:hover{border-color:var(--blue);color:#fff;}
  .level-tab.active{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 2px 0 rgba(0,0,0,0.4), 0 4px 10px rgba(0,0,0,0.3);}
  .level-caption{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:10.5px;color:rgba(255,255,255,0.45);
    text-align:center;margin-bottom:16px;letter-spacing:0.5px;}
  .progress-wrap{margin:0 0 16px;}
  .progress-label{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:10.5px;color:rgba(255,255,255,0.55);
    display:flex;justify-content:space-between;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px;}
  .progress-bar{height:6px;background:rgba(255,255,255,0.12);border-radius:99px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--blue));width:0%;transition:width .4s ease;}
  .lesson-stub{position:relative;display:flex;align-items:center;gap:10px;padding:11px 12px;margin-bottom:8px;
    background:rgba(255,255,255,0.04);border:1px dashed rgba(255,255,255,0.2);border-radius:9px;
    cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,background .15s ease,border-color .15s ease;
    box-shadow:0 2px 6px rgba(0,0,0,0.15);}
  .lesson-stub:hover{background:rgba(255,255,255,0.09);border-color:var(--blue);transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,0,0,0.22);}
  .lesson-stub.active{background:rgba(0,0,0,0.15);border-color:var(--blue);box-shadow:0 2px 8px rgba(0,0,0,0.3);}
  .lesson-stub .icon{font-size:15px;width:32px;height:32px;line-height:32px;text-align:center;border-radius:50%;flex-shrink:0;background:radial-gradient(circle at 35% 30%,rgba(0,0,0,0.38),rgba(0,0,0,0.08));border:1px solid rgba(0,0,0,0.45);box-shadow:0 0 10px rgba(0,0,0,0.3);}
  .lesson-stub .meta{flex:1;min-width:0;}
  .lesson-stub .code{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:9.5px;font-weight:700;color:#fff;letter-spacing:1px;}
  .lesson-stub .name{font-size:12.5px;font-weight:600;color:#fff;line-height:1.25;margin-top:1px;}
  .lesson-stub .check{width:18px;height:18px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.3);
    display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent;flex-shrink:0;}
  .lesson-stub.done .check{background:var(--cyan);border-color:var(--cyan);color:#fff;}
  #main{flex:1;background:var(--paper);min-height:100vh;}
  .navbar{padding:14px 32px;background:var(--navy-surface);border-bottom:1px solid var(--navy-border);
    display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:6;gap:16px;}
  .navbar-left{display:flex;align-items:center;gap:16px;min-width:0;}
  .navbar-menu-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--navy-border);background:transparent;
    color:var(--navy-text);font-size:15px;cursor:pointer;flex-shrink:0;}
  .navbar-menu-btn:hover{background:rgba(255,255,255,0.06);}
  .navbar-greeting-main{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:15px;font-weight:700;color:#fff;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .navbar-greeting-sub{font-size:11.5px;color:var(--navy-muted);margin-top:1px;white-space:nowrap;}
  .navbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .navbar-icon-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--navy-border);background:rgba(255,255,255,0.03);
    color:var(--navy-text);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .navbar-icon-btn:hover{background:rgba(255,255,255,0.08);}
  .navbar-avatar{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,0.04);border:1px solid var(--navy-border);
    border-radius:99px;padding:5px 12px 5px 5px;cursor:pointer;margin-left:4px;}
  .navbar-avatar:hover{background:rgba(255,255,255,0.09);}
  .navbar-avatar-initials{width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;
    font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .navbar-avatar-meta{display:flex;flex-direction:column;text-align:left;line-height:1.25;}
  .navbar-avatar-meta b{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:11.5px;color:#fff;font-weight:600;}
  .navbar-avatar-meta small{font-size:10px;color:var(--navy-muted);}
  .topbar{padding:12px 46px;border-bottom:1px solid var(--navy-border);display:flex;justify-content:space-between;
    align-items:center;background:var(--navy-surface);position:sticky;top:63px;z-index:5;}
  .topbar .breadcrumb{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:11.5px;color:var(--navy-muted);
    letter-spacing:1px;text-transform:uppercase;}
  .topbar .flight-code{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:12.5px;color:#fff;font-weight:600;
    background:rgba(255,255,255,0.06);padding:5px 12px;border-radius:6px;border:1px solid var(--navy-border);}
  .content{padding:42px 46px 90px;max-width:920px;margin:0 auto;}
  .content.dash-mode{max-width:1180px;}
  .dash-inner{padding-top:6px;}

  /* ============ SIDEBAR NAV (Dashboard / Core / Tracks) ============ */
  .side-nav-item{display:flex;align-items:center;gap:9px;width:100%;font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
    font-size:12.5px;font-weight:600;color:rgba(255,255,255,0.82);background:transparent;border:none;
    border-radius:8px;padding:9px 10px;margin-bottom:3px;cursor:pointer;text-align:left;transition:background .15s ease;}
  .side-nav-item:hover{background:rgba(255,255,255,0.06);}
  .side-nav-item.active,.side-nav-item.core-item{background:rgba(0,0,0,0.16);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,0.08), 0 2px 6px rgba(0,0,0,0.25);}
  .side-nav-icon{font-size:14px;flex-shrink:0;width:18px;text-align:center;}
  .side-nav-text{flex:1;}
  .side-nav-pct{font-size:10.5px;font-weight:700;color:var(--blue);background:rgba(0,0,0,0.18);
    padding:2px 7px;border-radius:99px;flex-shrink:0;}
  .side-nav-pct.lock{color:rgba(255,255,255,0.4);background:rgba(255,255,255,0.06);}
  .side-nav-item.locked{color:rgba(255,255,255,0.45);}
  .side-section-label{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:9.5px;font-weight:700;
    letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,0.35);margin:16px 4px 6px;}
  .side-divider{height:1px;background:rgba(255,255,255,0.1);margin:14px 0;}

  /* ============ SIDEBAR PROGRESS RINGS ============ */
  .side-ring{--pct:0;width:26px;height:26px;border-radius:50%;position:relative;flex-shrink:0;
    background:conic-gradient(var(--ring-color, var(--blue)) calc(var(--pct)*3.6deg), rgba(255,255,255,0.12) 0);}
  .side-ring:before{content:"";position:absolute;inset:3px;border-radius:50%;background:#0B3D24;}
  .side-ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:1;
    font-size:7px;font-weight:700;color:#fff;}
  .side-track-icon{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-size:13px;background:color-mix(in srgb, var(--ring-color, var(--blue)) 30%, transparent);flex-shrink:0;}

  /* ============ DASHBOARD ============ */
  .dash-hero{background:linear-gradient(120deg,#0B3D24,#146C43 60%,#1E8449);border-radius:16px;
    padding:0;color:#fff;margin-bottom:32px;position:relative;overflow:hidden;display:flex;align-items:stretch;
    box-shadow:0 14px 32px -14px rgba(7,45,25,0.45);}
  .dash-hero:before{content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 20% 20%,rgba(212,175,55,0.20),transparent 55%);pointer-events:none;}
  .dash-hero-text{position:relative;padding:36px 34px;flex:1;min-width:260px;display:flex;flex-direction:column;justify-content:center;}
  .dash-hero-eyebrow{color:#BFF0D1;font-size:11px;letter-spacing:3px;text-transform:uppercase;margin-bottom:10px;font-weight:600;}
  .dash-hero-text h2{font-size:28px;line-height:1.2;margin:0 0 12px;font-weight:700;}
  .dash-hero-text h2 b{color:#BFF0D1;font-weight:700;}
  .dash-hero-text p{max-width:420px;color:rgba(255,255,255,0.72);font-size:13.5px;line-height:1.6;margin:0 0 22px;}
  .dash-hero-btn{font-size:13px;font-weight:600;
    padding:12px 22px;border-radius:10px;border:none;background:#D4AF37;color:#12210F;cursor:pointer;width:fit-content;
    box-shadow:0 3px 0 rgba(0,0,0,0.3), 0 8px 18px rgba(0,0,0,0.28);transition:filter .15s ease,transform .12s ease,box-shadow .12s ease;}
  .dash-hero-btn:hover{filter:brightness(1.08);transform:translateY(-2px);box-shadow:0 5px 0 rgba(0,0,0,0.3), 0 12px 22px rgba(0,0,0,0.32);}
  .dash-hero-btn:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,0.3), 0 4px 10px rgba(0,0,0,0.22);}
  .dash-hero-photo{flex:0 0 42%;min-width:240px;background-color:#0B3D24;background-size:cover;
    background-repeat:no-repeat;background-position:center;position:relative;}
  .dash-hero-photo .ph-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:54px;opacity:0.3;}
  .dash-section-title{font-size:17px;font-weight:700;color:var(--ink);margin:0 0 4px;}
  .dash-section-sub{font-size:12.5px;color:var(--muted);margin:0 0 16px;}
  .dash-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-bottom:36px;}
  .dash-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;position:relative;
    border-top:3px solid var(--accent);box-shadow:0 6px 18px -12px rgba(7,22,47,0.18);transition:transform .15s ease,box-shadow .15s ease;}
  .dash-card:hover{transform:translateY(-2px);box-shadow:0 10px 22px -12px rgba(7,22,47,0.25);}
  .dash-lock{position:absolute;top:16px;right:16px;font-size:12px;opacity:0.45;}
  .dash-card-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    font-size:17px;background:color-mix(in srgb, var(--accent) 16%, white);margin-bottom:12px;}
  .dash-card h3{font-size:13.5px;margin:0 0 4px;color:var(--ink);font-weight:700;}
  .dash-card p{font-size:11px;color:var(--muted);line-height:1.5;margin:0 0 14px;min-height:32px;}
  .dash-progress{height:5px;background:var(--paper-2);border-radius:99px;overflow:hidden;margin-bottom:10px;}
  .dash-progress-fill{height:100%;background:var(--accent);border-radius:99px;}
  .dash-card-foot{display:flex;align-items:center;justify-content:space-between;}
  .dash-card-foot span{font-size:11px;font-weight:700;color:var(--accent);}
  .dash-card-foot button{font-size:11px;font-weight:600;padding:7px 13px;
    border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;transition:filter .15s ease;}
  .dash-card-foot button:hover{filter:brightness(1.08);}
  .dash-card-foot button:disabled{background:transparent;color:var(--muted);border-color:var(--line);cursor:not-allowed;}
  .dash-columns{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;}
  .dash-col-main{flex:2;min-width:320px;}
  .dash-col-side{flex:1;min-width:220px;}
  .next-lesson-list{display:flex;flex-direction:column;gap:12px;}
  .next-lesson-row{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);
    border-radius:14px;padding:10px 18px 10px 10px;cursor:pointer;transition:border-color .15s ease,box-shadow .15s ease;
    box-shadow:0 4px 14px -12px rgba(7,22,47,0.2);}
  .next-lesson-row:hover{border-color:var(--blue);box-shadow:0 8px 18px -12px rgba(7,22,47,0.28);}
  .next-lesson-thumb{width:56px;height:56px;border-radius:11px;background:color-mix(in srgb, var(--blue) 12%, white);display:flex;
    align-items:center;justify-content:center;font-size:20px;flex-shrink:0;position:relative;}
  .next-lesson-thumb .play-badge{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(7,22,47,0.35);border-radius:11px;color:#fff;font-size:11px;opacity:0;transition:opacity .15s ease;}
  .next-lesson-row:hover .play-badge{opacity:1;}
  .next-lesson-info{flex:1;min-width:0;}
  .next-lesson-title{font-size:13px;font-weight:600;color:var(--ink);}
  .next-lesson-sub{font-size:11.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .next-lesson-status{font-size:10px;font-weight:700;color:var(--blue);background:color-mix(in srgb, var(--blue) 12%, white);
    padding:3px 9px;border-radius:99px;flex-shrink:0;white-space:nowrap;}
  .next-lesson-play{width:32px;height:32px;border-radius:50%;border:none;background:var(--blue);color:#fff;
    cursor:pointer;flex-shrink:0;font-size:11px;}
  .next-lesson-empty{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;
    color:var(--muted);font-size:12.5px;}
  .dash-widget{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 6px 18px -12px rgba(7,22,47,0.18);}
  .dash-widget h4{font-size:12px;text-transform:uppercase;letter-spacing:0.5px;
    color:var(--muted);margin:0 0 18px;text-align:center;font-weight:700;}
  .donut{--pct:0;width:130px;height:130px;border-radius:50%;margin:0 auto 20px;position:relative;
    background:conic-gradient(var(--blue) calc(var(--pct)*3.6deg), var(--paper-2) 0);}
  .donut:before{content:"";position:absolute;inset:16px;border-radius:50%;background:#fff;}
  .donut span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:1;
    font-weight:700;font-size:22px;color:var(--ink);}
  .donut-legend{display:flex;flex-direction:column;gap:9px;}
  .donut-legend-row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text);}
  .donut-legend-row .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .donut-legend-row b{margin-left:auto;color:var(--muted);font-weight:700;}

  .board-hero{background:#0B3D24;border-radius:14px;padding:38px 38px 32px;color:#fff;margin-bottom:14px;
    position:relative;overflow:hidden;}
  .board-hero-bg{position:absolute;inset:0;z-index:0;}
  .board-hero-bg img{width:100%;height:100%;object-fit:cover;opacity:0.32;filter:brightness(0.55) saturate(1.1);}
  .board-hero-bg:after{content:"";position:absolute;inset:0;
    background:linear-gradient(100deg,rgba(11,61,36,0.96) 30%,rgba(11,61,36,0.55));}
  .board-hero:before{content:"";position:absolute;inset:0;z-index:1;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,0.02) 0 2px,transparent 2px 4px);pointer-events:none;}
  .board-hero > *:not(.board-hero-bg){position:relative;z-index:2;}
  .board-hero .eyebrow{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;color:#fff;-webkit-text-stroke:0.5px #000;text-shadow:0 1px 1px rgba(0,0,0,0.6);font-weight:700;font-size:11.5px;
    letter-spacing:3px;text-transform:uppercase;margin-bottom:10px;}
  .board-hero h2{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:32px;line-height:1.12;margin:0 0 14px;font-weight:700;}
  .board-hero p{max-width:600px;color:rgba(255,255,255,0.75);font-size:15px;line-height:1.6;margin:0 0 22px;}
  .home-photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px;}
  .home-photo{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);
    aspect-ratio:4/3;background:#fff;}
  .home-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .home-photo .label{position:absolute;left:0;right:0;bottom:0;padding:10px 12px 8px;
    background:linear-gradient(0deg,rgba(0,0,0,0.72),transparent);color:#fff;font-size:12px;font-weight:600;}
  .photo-card{width:100%;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff;}
  .photo-card img{width:100%;max-height:320px;object-fit:cover;display:block;}
  .board-table{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:12px;border-top:1px solid rgba(255,255,255,0.18);
    max-height:460px;overflow-y:auto;}
  .board-row{display:grid;grid-template-columns:44px 1fr 100px 90px;gap:10px;padding:9px 0;
    border-bottom:1px solid rgba(255,255,255,0.08);align-items:center;}
  .board-row.head{color:#fff;-webkit-text-stroke:0.4px #000;text-shadow:0 1px 1px rgba(0,0,0,0.6);font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:10px;
    position:sticky;top:0;background:#0B3D24;}
  .board-row .status{color:var(--cyan);font-size:10.5px;}
  .lesson-head{display:flex;align-items:flex-start;gap:18px;margin-bottom:8px;}
  .lesson-head .big-icon{font-size:30px;width:60px;height:60px;line-height:60px;text-align:center;border-radius:50%;flex-shrink:0;background:radial-gradient(circle at 35% 30%,rgba(0,0,0,0.35),rgba(0,0,0,0.07));border:2px solid rgba(0,0,0,0.5);box-shadow:0 0 22px rgba(0,0,0,0.28),0 4px 10px rgba(0,0,0,0.2),inset 0 1px 1px rgba(255,255,255,0.5);}
  .level-pill{display:inline-block;font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:10.5px;font-weight:600;
    letter-spacing:1.5px;padding:4px 10px;border-radius:99px;color:#fff;text-transform:uppercase;margin-bottom:8px;}
  .lesson-head h2{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:25px;margin:0 0 6px;line-height:1.15;}
  .lesson-head .subtitle{color:var(--muted);font-size:14px;margin:0;}
  .objective{background:var(--paper-2);border-left:3px solid var(--blue);padding:12px 16px;
    border-radius:0 8px 8px 0;font-size:13.5px;margin:18px 0 28px;line-height:1.6;}
  .objective b{color:var(--ink);}
  .objective ul{margin:6px 0 0;padding-left:20px;}
  .objective li{margin-bottom:4px;}
  .lesson-photo{width:100%;aspect-ratio:2/1;border-radius:16px;overflow:hidden;margin:4px 0 28px;box-shadow:0 8px 24px rgba(11,61,36,0.18);}
  .lesson-photo img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;}
  .section{margin-bottom:32px;}
  .section-title{display:flex;align-items:center;gap:10px;font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:12px;
    letter-spacing:2px;text-transform:uppercase;color:var(--ink);margin-bottom:13px;font-weight:600;}
  .section-title .num{background:radial-gradient(circle at 35% 30%,#3A3A3A,#000000);color:#fff;width:22px;height:22px;border-radius:50%;box-shadow:0 0 8px rgba(0,0,0,0.45),0 2px 4px rgba(0,0,0,0.3),inset 0 1px 1px rgba(255,255,255,0.35);
    display:flex;align-items:center;justify-content:center;font-size:10.5px;flex-shrink:0;}
  .section-title:after{content:"";flex:1;height:1px;background:var(--line);}
  .vocab-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .vocab-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 14px;}
  .vocab-card .en{font-weight:600;font-size:14px;color:var(--ink);}
  .vocab-card .pt{font-size:12px;color:var(--muted);margin-top:2px;}
  .dialogue{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px 22px;}
  .line{display:flex;gap:12px;margin-bottom:15px;}
  .line:last-child{margin-bottom:0;}
  .line .who{width:92px;flex-shrink:0;font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:10.5px;font-weight:600;
    color:var(--cyan);padding-top:2px;text-transform:uppercase;}
  .line .bubble .en{font-size:14px;color:var(--ink);line-height:1.5;}
  .line .bubble .pt{font-size:12px;color:var(--muted);margin-top:3px;font-style:italic;}
  .audio-card{display:flex;align-items:flex-start;gap:16px;background:#fff;border:1px solid var(--line);
    border-radius:12px;padding:16px 20px;flex-wrap:wrap;}
  .audio-card .play{width:44px;height:44px;border-radius:50%;background:var(--cyan);color:#fff;display:flex;
    align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
  .audio-card .info{flex:1;min-width:200px;}
  .audio-card .info b{display:block;font-size:14px;color:var(--ink);margin-bottom:2px;}
  .audio-card .info span{font-size:12px;color:var(--muted);}
  .audio-card .actions{display:flex;gap:8px;flex-wrap:wrap;}
  .audio-card a, .audio-card button{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:11.5px;text-decoration:none;
    color:var(--ink);background:var(--paper-2);padding:8px 14px;border-radius:7px;border:1px solid var(--line);
    white-space:nowrap;cursor:pointer;}
  .audio-card a:hover, .audio-card button:hover{background:var(--blue);border-color:var(--blue);}
  .audio-pending{font-size:11.5px;color:var(--coral);font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;margin-top:4px;display:block;}
  .script-block{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-top:10px;}
  .script-title{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:11px;text-transform:uppercase;
    letter-spacing:1px;color:var(--muted);margin-bottom:12px;}
  .script-line{font-size:13.5px;line-height:1.9;color:var(--ink);}
  .script-line b{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;color:var(--cyan);text-transform:uppercase;
    font-size:11px;margin-right:8px;}
  .quiz-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:12px;}
  .quiz-q{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:11px;}
  .quiz-opts{display:flex;flex-direction:column;gap:8px;}
  .quiz-opt{text-align:left;padding:9px 13px;border:1px solid var(--line);border-radius:8px;background:var(--paper);
    font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:13px;cursor:pointer;transition:all .15s ease;color:var(--text);}
  .quiz-opt:hover{border-color:var(--ink);}
  .quiz-opt.correct{background:rgba(34,211,196,0.15);border-color:var(--cyan);color:var(--cyan);font-weight:600;}
  .quiz-opt.wrong{background:rgba(255,90,95,0.12);border-color:var(--coral);color:var(--coral);}
  .quiz-opt.disabled{cursor:default;}
  .score-bar{display:flex;align-items:center;justify-content:space-between;background:var(--ink);color:#fff;
    padding:15px 20px;border-radius:12px;font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:12.5px;margin-top:4px;}
  .score-bar .big{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:20px;color:var(--blue);}
  .drill-card{background:#fff;border:1px solid var(--line);border-left:3px solid var(--cyan);border-radius:0 10px 10px 0;
    padding:14px 18px;margin-bottom:10px;}
  .drill-card b{display:block;color:var(--ink);font-size:12px;font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
    text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;}
  .drill-card p{margin:0;font-size:13.5px;color:var(--text);line-height:1.6;}
  .drill-card code{background:var(--paper-2);padding:1px 6px;border-radius:4px;font-weight:700;color:var(--ink);}
  .homework-card{background:var(--ink);color:#fff;border-radius:12px;padding:20px 22px;}
  .homework-card ol,.homework-card ul{margin:0;padding-left:20px;}
  .homework-card li{font-size:13.5px;line-height:1.7;color:rgba(255,255,255,0.9);}
  .homework-card li::marker{color:var(--blue);font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;}
  .tip-card{display:flex;gap:14px;background:#E8F3FC;border:1px solid #BFE0F5;border-radius:12px;padding:15px 18px;}
  .tip-card .stamp{font-size:20px;flex-shrink:0;}
  .tip-card p{margin:0;font-size:13px;line-height:1.6;color:#123A5C;}
  .example-box{background:var(--paper-2);border-radius:8px;padding:12px 14px;font-size:13px;color:var(--muted);
    white-space:pre-line;margin-top:10px;line-height:1.6;}
  .lesson-nav{display:flex;justify-content:space-between;margin-top:38px;gap:8px;}
  .nav-btn{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:11.5px;padding:11px 18px;border-radius:8px;
    border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;letter-spacing:0.5px;
    box-shadow:0 3px 0 rgba(0,0,0,0.35), 0 6px 14px rgba(0,0,0,0.18);transition:transform .12s ease,box-shadow .12s ease;position:relative;top:0;}
  .nav-btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 0 rgba(0,0,0,0.35), 0 8px 16px rgba(0,0,0,0.22);}
  .nav-btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,0.35), 0 2px 6px rgba(0,0,0,0.15);}
  .nav-btn.ghost{background:transparent;color:var(--ink);box-shadow:none;}
  .nav-btn.ghost:hover:not(:disabled){transform:none;box-shadow:none;background:var(--paper-2);}
  .nav-btn.ghost:active:not(:disabled){transform:none;box-shadow:none;}
  .nav-btn:disabled{opacity:0.3;cursor:default;}
  .topic-track{display:flex;gap:5px;margin:14px 0 0;flex-wrap:wrap;}
  .track-dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,0.15);}
  .track-dot.filled{background:var(--blue);}
  @media (max-width:860px){
    #app{flex-direction:column;}
    #sidebar{width:100%;height:auto;position:relative;min-width:0;}
    .content{padding:26px 18px 70px;}
    .vocab-grid{grid-template-columns:1fr;}
    .board-row{grid-template-columns:34px 1fr 70px;}
  }

  /* ============ ROLE GATE ============ */
  .role-gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:var(--ink);color:#fff;padding:40px 20px;position:relative;overflow:hidden;}
  .gate-mosaic{position:absolute;inset:0;z-index:0;}
  .gate-mosaic img{width:100%;height:100%;object-fit:cover;display:block;
    filter:grayscale(8%) brightness(0.6) saturate(1.05);}
  .gate-overlay{position:absolute;inset:0;z-index:1;
    background:radial-gradient(circle at 50% 38%,rgba(0,0,0,0.35),transparent 60%),
      linear-gradient(120deg,rgba(10,12,16,0.95),rgba(24,20,14,0.9));}
  .role-gate:before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
    background-image:radial-gradient(rgba(0,0,0,0.35) 1px,transparent 1.6px),
      repeating-linear-gradient(0deg,rgba(255,255,255,0.02) 0 2px,transparent 2px 4px);
    background-size:28px 28px, auto;}
  .gate-logo{width:104px;height:104px;border-radius:50%;object-fit:cover;position:relative;z-index:2;
    box-shadow:0 8px 28px rgba(0,0,0,0.45);border:3px solid rgba(255,255,255,0.85);margin-bottom:14px;}
  .gate-school{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:13px;font-weight:700;color:#fff;
    letter-spacing:2px;text-transform:uppercase;position:relative;z-index:2;margin-bottom:2px;
    text-shadow:0 2px 10px rgba(0,0,0,0.4);}
  .role-gate .gate-brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;position:relative;z-index:2;}
  .role-gate .gate-brand .dot{width:11px;height:11px;border-radius:50%;background:var(--blue);}
  .role-gate .gate-brand h1{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:27px;font-weight:700;margin:0;
    text-shadow:0 2px 12px rgba(0,0,0,0.35);text-align:center;}
  .role-gate .gate-sub{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:12px;color:var(--blue);
    letter-spacing:2px;text-transform:uppercase;margin-bottom:40px;position:relative;z-index:2;text-align:center;}
  .gate-cards{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;max-width:760px;position:relative;z-index:2;}
  .gate-card{width:280px;background:rgba(16,26,46,0.50);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.20);border-radius:14px;padding:34px 28px;cursor:pointer;
    transition:all .18s ease;text-align:center;box-shadow:0 14px 36px rgba(0,0,0,0.28);}
  .gate-card:hover{background:rgba(16,26,46,0.68);border-color:rgba(0,0,0,0.7);
    box-shadow:0 18px 44px rgba(0,0,0,0.34);transform:translateY(-4px);}
  .gate-card h3{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:17px;font-weight:700;margin:0;
    letter-spacing:0.2px;}
  .gate-card .gate-cta{margin-top:14px;font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:10.5px;
    color:var(--blue);letter-spacing:1.5px;text-transform:uppercase;}
  .teacher-login{display:none;flex-direction:column;gap:10px;margin-top:14px;}
  .teacher-login input{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:13px;padding:10px 12px;
    border-radius:8px;border:1px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.06);color:#fff;}
  .teacher-login input::placeholder{color:rgba(255,255,255,0.4);}
  .teacher-login button{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:12px;padding:9px 12px;
    border-radius:8px;border:1px solid var(--blue);background:var(--blue);color:#fff;
    font-weight:600;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,0.45), 0 6px 14px rgba(0,0,0,0.3);
    transition:transform .12s ease,box-shadow .12s ease;}
  .teacher-login button:hover{transform:translateY(-1px);box-shadow:0 4px 0 rgba(0,0,0,0.45), 0 8px 18px rgba(0,0,0,0.35);}
  .teacher-login button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,0.45), 0 2px 6px rgba(0,0,0,0.2);}
  .teacher-login-error{display:none;color:var(--coral);font-size:11.5px;font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;}
  .gate-foot{margin-top:30px;font-size:11.5px;color:rgba(255,255,255,0.4);font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
    position:relative;z-index:2;text-align:center;max-width:500px;}
  .gate-admin-link{margin-top:16px;position:relative;z-index:2;font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
    font-size:10.5px;color:rgba(255,255,255,0.35);background:transparent;border:none;cursor:pointer;
    letter-spacing:0.5px;}
  .gate-admin-link:hover{color:rgba(255,255,255,0.75);text-decoration:underline;}

  /* ============ PORTAL TAG / SIDEBAR ============ */
  .portal-tag{display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);border-radius:8px;
    padding:8px 10px;font-size:11.5px;font-weight:600;margin-bottom:16px;}
  .portal-tag.teacher{border-color:rgba(0,0,0,0.5);}
  .switch-portal{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:10px;color:var(--blue);
    background:transparent;border:none;cursor:pointer;letter-spacing:0.5px;}
  .switch-portal:hover{text-decoration:underline;}
  .sidebar-action{display:flex;align-items:center;gap:10px;width:100%;font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
    font-size:12px;font-weight:600;color:#fff;background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.14);border-radius:9px;padding:9px 12px;margin-top:10px;
    cursor:pointer;text-align:left;transition:background .15s ease,border-color .15s ease;}
  .sidebar-action:hover{background:rgba(255,255,255,0.09);border-color:rgba(255,255,255,0.32);}
  .sidebar-action .ico{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;
    font-size:12px;flex-shrink:0;background:rgba(0,0,0,0.25);color:var(--blue);}
  .sidebar-action.locked{color:rgba(255,255,255,0.45);cursor:pointer;}
  .sidebar-action.locked .ico{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.4);}
  .track-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:20px;}
  @media (max-width:720px){.track-grid{grid-template-columns:1fr;}}
  .track-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;position:relative;overflow:hidden;}
  .track-card .track-icon{font-size:28px;margin-bottom:10px;}
  .track-card h3{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:16px;margin:0 0 8px;color:var(--ink);}
  .track-card p{font-size:12.5px;color:var(--muted);line-height:1.6;margin:0;}
  .track-card .soon-badge{position:absolute;top:16px;right:16px;font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
    font-size:10px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;color:var(--coral);
    background:rgba(192,71,44,0.1);padding:4px 9px;border-radius:99px;}
  .track-teaser{background:var(--ink);color:#fff;border-radius:14px;padding:26px 30px;margin-top:16px;
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  .track-teaser .stamp{font-size:32px;}
  .track-teaser h3{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:17px;margin:0 0 4px;}
  .track-teaser p{font-size:12.5px;color:rgba(255,255,255,0.7);margin:0;}
  .track-teaser button{margin-left:auto;font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:12px;font-weight:600;
    padding:10px 18px;border-radius:8px;border:1px solid var(--blue);background:var(--blue);color:#fff;cursor:pointer;}
  .admin-link{width:100%;font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:11px;color:rgba(255,255,255,0.7);
    background:rgba(255,255,255,0.04);border:1px dashed rgba(255,255,255,0.2);border-radius:8px;
    padding:9px 10px;margin-bottom:16px;cursor:pointer;text-align:left;}
  .admin-link:hover{color:#fff;border-color:var(--blue);}

  /* ============ ADMIN PANEL ============ */
  .admin-modal{display:none;position:fixed;inset:0;background:rgba(8,27,46,0.82);z-index:55;
    align-items:center;justify-content:center;padding:24px;}
  .admin-box{background:#fff;border-radius:14px;max-width:460px;width:100%;padding:26px 28px;
    position:relative;max-height:88vh;overflow-y:auto;}
  .admin-box h3{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:19px;margin:0 0 6px;color:var(--ink);}
  .admin-box .admin-note{font-size:12.5px;color:var(--muted);line-height:1.6;margin-bottom:18px;}
  .admin-field{margin-bottom:14px;}
  .admin-field label{display:block;font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:11px;
    text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);margin-bottom:5px;}
  .admin-field input,.admin-field select{width:100%;font-size:13.5px;padding:9px 11px;border-radius:7px;
    border:1px solid var(--line);font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;box-sizing:border-box;margin-top:6px;}
  .admin-field input:first-of-type,.admin-field select:first-of-type{margin-top:0;}
  .admin-hr{border:none;border-top:1px solid var(--line);margin:22px 0;}
  .admin-userrow{display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
  .admin-userrow:last-child{border-bottom:none;}
  .admin-userrow .who{color:var(--ink);}
  .admin-userrow .who b{font-weight:700;}
  .admin-userrow .who span{color:var(--muted);font-size:11px;display:block;}
  .admin-userrow button{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:11px;color:var(--coral);
    background:transparent;border:none;cursor:pointer;flex-shrink:0;}
  .admin-userrow button:hover{text-decoration:underline;}
  .admin-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;}
  .admin-actions button{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:12px;padding:10px 16px;
    border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;}
  .admin-actions button.ghost{background:transparent;color:var(--ink);}
  .admin-actions button:hover{background:var(--blue);border-color:var(--blue);color:#fff;}
  .admin-msg{margin-top:12px;font-size:12.5px;padding:9px 12px;border-radius:8px;display:none;}
  .admin-msg.show{display:block;background:rgba(0,0,0,0.13);color:var(--blue);}
  .admin-close{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;

/* ================= HELPERS ================= */
function lessonsOf(level){ return LESSONS.filter(l=>l.level===level); }
function codeOf(l){ return l.level + ' · ' + l.number.split('/')[0]; }
function lessonsOfTrack(trackId, level){ return (TRACK_LESSONS[trackId]||[]).filter(l=>l.level===level); }
function allLessonsFlat(){ return LESSONS.concat(...Object.values(TRACK_LESSONS)); }
function poolForLesson(l){
  if(LESSONS.includes(l)) return LESSONS;
  for(const k in TRACK_LESSONS){ if(TRACK_LESSONS[k].includes(l)) return TRACK_LESSONS[k]; }
  return LESSONS;
}
function trackPct(trackId){
  const pool = TRACK_LESSONS[trackId]||[];
  if(!pool.length) return 0;
  return Math.round(pool.filter(l=>completed.has(l.id)).length/pool.length*100);
}
function trackAllDone(trackId){
  const pool = TRACK_LESSONS[trackId]||[];
  return pool.length>0 && pool.every(l=>completed.has(l.id));
}
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function normalize(s){ return String(s).trim().toLowerCase().replace(/[.,!?;:"']/g,'').replace(/\s+/g,' '); }
function answerVariants(a){
  const variants = new Set();
  const base = String(a).trim();
  variants.add(normalize(base));
  const noParens = base.replace(/\s*\([^)]*\)\s*/g, ' ').replace(/\s+/g,' ').trim();
  if(noParens) variants.add(normalize(noParens));
  const parenMatch = base.match(/\(([^)]+)\)/);
  if(parenMatch) variants.add(normalize(parenMatch[1]));
  return variants;
}
function answerMatches(val, a){
  return answerVariants(a).has(normalize(val));
}

/* ================= ROLE GATE ================= */
(function renderGateLogo(){
  const logo = document.getElementById('gateLogo');
  if(logo && LOGO_URI) logo.src = LOGO_URI;
})();
function setGateRole(role){
  gateRole = role;
  document.querySelectorAll('#gateTabs .gate-tab').forEach(function(btn){
    btn.classList.toggle('on', btn.dataset.role===role);
  });
  const err = document.getElementById('gateLoginError');
  err.classList.remove('show');
  err.style.display = 'none';
  const label = role==='teacher' ? 'Entrar como professor' : role==='admin' ? 'Entrar como admin' : 'Entrar no curso';
  document.getElementById('gateSubmitBtn').textContent = label + ' \u2192';
}
function showGate(){
  document.getElementById('gate').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  document.documentElement.style.visibility = '';
  const mosaic = document.getElementById('gateMosaic');
  if(mosaic && !mosaic.querySelector('img')){
    mosaic.innerHTML = `<img src="${GATE_PHOTO}" alt="">`;
  }
}
function submitGateLogin(){
  const loginInput = document.getElementById('gateLoginInput');
  const passInput = document.getElementById('gatePassInput');
  const err = document.getElementById('gateLoginError');
  const login = loginInput.value.trim();
  const password = passInput.value;
  err.style.display = 'none';
  if(!login || !password){
    err.textContent = 'Preencha login e senha.';
    err.style.display = 'block';
    return;
  }
  apiFetch('/login.php', {method:'POST', body: JSON.stringify({role:gateRole, login:login, password:password, course:COURSE_ID})})
    .then(function(user){ passInput.value=''; enterApp(user); })
    .catch(function(e){
      err.textContent = e.message || 'Login ou senha incorretos.';
      err.style.display = 'block';
      passInput.value = '';
      passInput.focus();
    });
}
function enterApp(user){
  currentRole = user.role;
  currentUserId = user.id;
  if(user.role==='student'){ currentStudentName = user.name; currentLevel = user.level || 'A1'; }
  if(user.role==='teacher'){ currentTeacherName = user.name; }
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.documentElement.style.visibility = '';
  currentView = 'home';
  currentLessonId = null;
  if(user.role==='admin'){
    renderAdminView();
    return;
  }
  if(user.role==='teacher'){
    loadRoster(function(){
      renderSidebar();
      renderHome();
      loadPendingReviews();
    });
  }else{
    loadOwnProgress(function(){
      renderSidebar();
      renderHome();
    });
  }
}
function checkSession(){
  apiFetch('/me.php').then(function(user){
    if(user && user.role){ enterApp(user); } else { showGate(); }
  }).catch(function(){ showGate(); });
}
function logout(){
  apiFetch('/logout.php', {method:'POST', body: JSON.stringify({})}).catch(function(){}).finally(function(){
    currentRole = null; currentUserId = null; currentStudentName = null; currentTeacherName = null;
    currentLessonId = null; completed = new Set(); unlockedSet = new Set();
    roster = []; pendingReviews = []; managedStudentId = null; reviewStudentId = null;
    const li = document.getElementById('gateLoginInput'); if(li) li.value = '';
    const pi = document.getElementById('gatePassInput'); if(pi) pi.value = '';
    showGate();
  });
}
function exitPortal(){ logout(); }

/* ================= PROGRESS / UNLOCK ================= */
function loadOwnProgress(cb){
  apiFetch('/progress.php').then(function(data){
    // completed holds numeric lesson ids everywhere else in this file, but the
    // server stores/returns classKey strings -- convert back on the way in.
    completed = new Set((data.completed || []).map(Number));
    unlockedSet = new Set(data.unlocked || []);
    assignedTaskMessage = data.assignedTask || null;
    if(cb) cb();
  }).catch(function(){ completed = new Set(); unlockedSet = new Set(); if(cb) cb(); });
}
function loadManagedProgress(studentId, cb){
  apiFetch('/progress.php?studentId=' + encodeURIComponent(studentId)).then(function(data){
    unlockedSet = new Set(data.unlocked || []);
    if(cb) cb(data);
  }).catch(function(){ if(cb) cb(null); });
}
function isLockedForCurrentUser(l){
  if(currentRole==='teacher' || currentRole==='admin') return false;
  return !unlockedSet.has(String(l.id));
}

function handleStudentAccessError(e, studentId){
  const msg = e && e.message || '';
  if(msg==='forbidden' || msg==='not your student'){
    showToast('Este aluno não está mais na sua lista. Atualizando...');
    loadRoster(function(){
      if(managedStudentId===studentId && !roster.find(function(r){ return r.id===studentId; })){
        managedStudentId = null;
        unlockedSet = new Set();
      }
      renderTeacherPanel();
    });
  }else{
    showToast(msg||'Erro');
  }

function toggleUnlock(studentId, lessonId){
  const key = String(lessonId);
  const willUnlock = !unlockedSet.has(key);
  apiFetch('/unlock_toggle.php', {method:'POST', body: JSON.stringify({studentId:studentId, classKey:key, unlocked:willUnlock})})
    .then(function(){
      if(willUnlock) unlockedSet.add(key); else unlockedSet.delete(key);
      renderTeacherPanel();
    }).catch(function(e){ handleStudentAccessError(e, studentId); });
}

/* ================= REVIEW / HOMEWORK ================= */
/* 3 etapas: 1 Verbs (vocab_drills), 2 Expressions (expr_drills),
   3 Grammar & Comprehension (translate / match the columns / fill-in-blank).
   All content is reused from fields the lesson already has — nothing new is authored per lesson. */
var hwStage = 1;          // stage currently shown to the student
var hwReviewStage = 1;    // stage currently shown to the teacher while reviewing
var hwSubsCache = {};     // {etapaNum: submission|null} for the lesson currently open

var IRREGULAR_VERBS_FILLBLANK = {
  come:['come','came'], keep:['keep','kept'], take:['take','took','taken'],
  get:['get','got','gotten'], give:['give','gave','given'], make:['make','made'],
  break:['break','broke','broken'], hold:['hold','held'], catch:['catch','caught'],
  buy:['buy','bought'], bring:['bring','brought'], think:['think','thought'],
  understand:['understand','understood'], spend:['spend','spent'], lend:['lend','lent'],
  meet:['meet','met'], tell:['tell','told'], sell:['sell','sold'], teach:['teach','taught'],
  fight:['fight','fought'], find:['find','found'], say:['say','said'], go:['go','went','gone'],
  do:['do','did','done'], know:['know','knew','known'], see:['see','saw','seen'],
  run:['run','ran'], beat:['beat','beaten'], write:['write','wrote','written'],
  fall:['fall','fell','fallen'], shake:['shake','shook','shaken'], lay:['lay','laid'],
  pay:['pay','paid'], blow:['blow','blew','blown'], stand:['stand','stood'], dig:['dig','dug'],
  build:['build','built'], draw:['draw','drew','drawn'], throw:['throw','threw','thrown'],
  hang:['hang','hung']
};
function escapeRegexFillBlank(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function buildFuzzyBlankRegex(phrase){
  const words = phrase.split(/\s+/).filter(Boolean);
  const parts = words.map(function(w,i){
    const clean = w.replace(/[^a-zA-Z']/g,'');
    if(!clean) return escapeRegexFillBlank(w);
    const lower = clean.toLowerCase();
    if(lower==='someone' || lower==='something'){
      return "[a-zA-Z' ]+?";
    }
    if(i===0 && IRREGULAR_VERBS_FILLBLANK[lower]){
      return '(?:' + IRREGULAR_VERBS_FILLBLANK[lower].map(escapeRegexFillBlank).join('|') + ')' + "\\w*";
    }
    if(/[^aeiou]y$/i.test(clean)){
      const stem = escapeRegexFillBlank(clean.slice(0,-1));
      return '(?:' + escapeRegexFillBlank(clean) + "\\w*|" + stem + "(?:ies|ied|ying))";
    }
    return escapeRegexFillBlank(clean) + "\\w*";
  });
  return new RegExp('\\b' + parts.join('\\s+') + '\\b', 'i');
}
function makeFillBlankItem(pt, en, expressionsList){
  let best = null;
  (expressionsList||[]).forEach(function(e){
    const phrase = (e.phrase||'').trim().replace(/[.!?]+$/, '');
    if(!phrase) return;
    const lowerEn = en.toLowerCase();
    const lowerPhrase = phrase.toLowerCase();
    let idx = lowerEn.indexOf(lowerPhrase);
    let matched = idx>=0 ? en.substr(idx, phrase.length) : null;
    if(idx<0){
      try{
        const re = buildFuzzyBlankRegex(phrase);
        const m = en.match(re);
        if(m){ idx = m.index; matched = m[0]; }
      }catch(e2){ /* ignore */ }
    }
    if(idx>=0 && matched && (!best || matched.length>best.len)){
      best = {idx:idx, len:matched.length, answer:matched};
    }
  });
  if(!best) return {pt:pt, before:'', after:'', answer:en, fullSentence:true};
  return {pt:pt, before:en.slice(0,best.idx), after:en.slice(best.idx+best.len), answer:best.answer};
}
function buildHomeworkStages(l){
  const verbs = (l.vocab_drills||[]).map(d=>({pt:d.pt, en:d.en, tokens:d.tokens}));
  const expressionsFill = (l.expr_drills||[]).map(d=>makeFillBlankItem(d.pt, d.en, l.expressions||[]));
  const translateItems = (l.translate||[]).map(t=>({q:t.q, a:t.a}));
  const matchPairs = (l.vocab||[]).slice(0,8).map(v=>({term:v.term, pt:v.pt}));
  const fillItems = (l.fill||[]).map(f=>({q:f.q, a:f.a}));
  return {
    1: {label:'Stage 1', type:'build', items: verbs},
    2: {label:'Stage 2', type:'fillblank', items: expressionsFill},
    3: {label:'Stage 3', type:'grammar', translate: translateItems, match: matchPairs, fill: fillItems}
  };
}

function hwDraftKey(lessonId, stageNum){
  return 'hwDraft_' + (currentUserId||'anon') + '_' + lessonId + '_' + stageNum;
}
function saveHwDraft(lessonId, stageNum){
  const l = allLessonsFlat().find(x=>x.id===lessonId);
  if(!l) return;
  const stage = buildHomeworkStages(l)[stageNum];
  if(!stage) return;
  let draft;
  if(stage.type==='build'){
    draft = {type:'build', items: stage.items.map(function(item,i){
      const slot = document.getElementById(`hw-${lessonId}-${i}-slot`);
      return slot ? Array.from(slot.children).map(c=>c.textContent) : [];
    })};
  }else if(stage.type==='fillblank'){
    draft = {type:'fillblank', items: stage.items.map(function(item,i){
      const inp = document.getElementById(`hw-${lessonId}-${i}-input`);
      return inp ? inp.value : '';
    })};
  }else{
    draft = {type:'grammar',
      translate: stage.translate.map(function(it,i){ const inp=document.getElementById(`hw-${lessonId}-tr-input-${i}`); return inp?inp.value:''; }),
      match: stage.match.map(function(p,i){ const sel=document.getElementById(`hw-${lessonId}-match-sel-${i}`); return sel?sel.value:''; }),
      fill: stage.fill.map(function(it,i){ const inp=document.getElementById(`hw-${lessonId}-fill-input-${i}`); return inp?inp.value:''; })
    };
  }
  try{ localStorage.setItem(hwDraftKey(lessonId, stageNum), JSON.stringify(draft)); }catch(e){}
}
function saveHwDraftFromDomId(domId){
  const m = domId.match(/^hw-(\d+)-/);
  if(m) saveHwDraft(parseInt(m[1],10), hwStage);
}
function loadHwDraft(lessonId, stageNum){
  try{
    const raw = localStorage.getItem(hwDraftKey(lessonId, stageNum));
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function clearHwDraft(lessonId, stageNum){
  try{ localStorage.removeItem(hwDraftKey(lessonId, stageNum)); }catch(e){}
}
function applyHwDraft(lessonId, stageNum){
  if(currentRole!=='student') return;
  const l = allLessonsFlat().find(x=>x.id===lessonId);
  if(!l) return;
  const stage = buildHomeworkStages(l)[stageNum];
  const draft = loadHwDraft(lessonId, stageNum);
  if(!stage || !draft) return;
  if(stage.type==='build' && draft.type==='build'){
    (draft.items||[]).forEach(function(words, i){
      const slot = document.getElementById(`hw-${lessonId}-${i}-slot`);
      const bank = document.getElementById(`hw-${lessonId}-${i}-bank`);
      if(!slot || !bank || !words) return;
      words.forEach(function(word){
        const chip = Array.from(bank.querySelectorAll('.chip:not(.used)')).find(c=>c.textContent===word);
        if(chip) chipClick(`hw-${lessonId}-${i}`, chip);
      });
    });
  }else if(stage.type==='fillblank' && draft.type==='fillblank'){
    (draft.items||[]).forEach(function(val,i){ const inp=document.getElementById(`hw-${lessonId}-${i}-input`); if(inp && val) inp.value = val; });
  }else if(stage.type==='grammar' && draft.type==='grammar'){
    (draft.translate||[]).forEach(function(val,i){ const inp=document.getElementById(`hw-${lessonId}-tr-input-${i}`); if(inp && val) inp.value = val; });
    (draft.match||[]).forEach(function(val,i){ const sel=document.getElementById(`hw-${lessonId}-match-sel-${i}`); if(sel && val) sel.value = val; });
    (draft.fill||[]).forEach(function(val,i){ const inp=document.getElementById(`hw-${lessonId}-fill-input-${i}`); if(inp && val) inp.value = val; });
  }
}
function manualSaveHwDraft(lessonId, stageNum){
  saveHwDraft(lessonId, stageNum);
  showToast('\ud83d\udcbe Progresso salvo. Voc\u00ea pode continuar depois.');
}

  return `<div class="panel-tabs">${[1,2,3].map(function(n){
    const stages = buildHomeworkStages(allLessonsFlat().find(x=>x.id===lessonId));
    return `<button type="button" class="panel-tab ${n===current?'on':''}" onclick="${setterFn}(${lessonId},${n})">${esc(stages[n].label)}</button>`;

}

function renderMatchColumns(domId, pairs){
  const shuffledPt = shuffleTokens(pairs.map(p=>p.pt));
  const legend = shuffledPt.map((pt,idx)=>`<b>${idx+1}.</b> ${esc(pt)}`).join('&emsp;');
  const rows = pairs.map((p,i)=>{
    const options = shuffledPt.map((pt,idx)=>`<option value="${idx}">${idx+1}</option>`).join('');
    return `<div class="ex-item">
      <div class="ex-q">${i+1}. ${esc(p.term)}</div>
      <div class="ex-row"><select class="ex-input" id="${domId}-sel-${i}" onchange="saveHwDraftFromDomId('${domId}')"><option value="">—</option>${options}</select></div>
    </div>`;
  }).join('');
  return `<div class="drill-block" id="${domId}" data-shuffled="${encodeURIComponent(JSON.stringify(shuffledPt))}">
    <div class="drill-pt">🔗 <span class="drill-pt-label">Coluna B (Português):</span> ${legend}</div>
    ${rows}
    <div class="drill-actions"><button type="button" class="drill-btn" onclick="checkMatchColumns('${domId}')">Verificar ✓</button></div>
    <div class="drill-feedback" id="${domId}-fb"></div>
  </div>`;
}
function checkMatchColumns(domId){
  const box = document.getElementById(domId);
  const shuffledPt = JSON.parse(decodeURIComponent(box.dataset.shuffled));
  const rows = box.querySelectorAll('select.ex-input');
  let allAnswered = true, correctCount = 0;
  rows.forEach(function(sel, i){
    const expectedTerm = box.querySelectorAll('.ex-q')[i].textContent;
    if(sel.value==='') allAnswered = false;
  });
  const fb = document.getElementById(domId+'-fb');
  if(!allAnswered){
    fb.className = 'drill-feedback show no';
    fb.textContent = '❌ Responda todos os pares antes de verificar.';
    return;
  }
  fb.className = 'drill-feedback show ok';
  fb.textContent = '✅ Respostas registradas. O professor vai conferir se estão corretas.';
}
function renderTranslateOrFillItems(domId, items, kind){
  return items.map((it,i)=>`
    <div class="ex-item">
      <div class="ex-q">${i+1}. ${esc(it.q)}</div>
      <div class="ex-row">
        <input type="text" class="ex-input" id="${domId}-input-${i}" placeholder="${kind==='translate'?'Type the translation in English':'Digite sua resposta'}" oninput="saveHwDraftFromDomId('${domId}')">
      </div>
    </div>`).join('');
}

function renderFillBlankItems(domId, items){
  return items.map((item,i)=>{
    const middle = item.fullSentence
      ? `<input type="text" class="ex-input" id="${domId}-${i}-input" style="width:100%;margin-top:6px;" placeholder="Write the full sentence in English" oninput="saveHwDraftFromDomId('${domId}-${i}')">`
      : `${esc(item.before)}<input type="text" class="ex-input" id="${domId}-${i}-input" style="width:170px;display:inline-block;margin:0 6px;vertical-align:middle;" placeholder="..." oninput="saveHwDraftFromDomId('${domId}-${i}')">${esc(item.after)}`;
    return `<div class="drill-block" id="${domId}-${i}" data-answer="${encodeURIComponent(item.answer)}">
    <div class="drill-pt">🗣️ <span class="drill-pt-label">Professor fala:</span> <b>"${esc(item.pt)}"</b></div>
    <div class="ex-row" style="margin:10px 0;font-size:14.5px;line-height:1.6;">${middle}</div>
    <div class="drill-actions">
      <button type="button" class="drill-btn" onclick="checkFillBlank('${domId}-${i}')">Verificar ✓</button>
      <button type="button" class="drill-btn ghost" onclick="revealFillBlank('${domId}-${i}')">Ver resposta 👁</button>
    </div>
    <div class="drill-feedback" id="${domId}-${i}-fb"></div>
  </div>`;
  }).join('');
}
function checkFillBlank(blockId){
  const block = document.getElementById(blockId);
  const input = document.getElementById(`${blockId}-input`);
  const fb = document.getElementById(`${blockId}-fb`);
  const answer = decodeURIComponent(block.dataset.answer);
  const correct = answerMatches(input.value, answer);
  fb.className = 'drill-feedback show ' + (correct?'ok':'no');
  fb.textContent = correct ? '✅ Certinho! Muito bem.' : '❌ Quase lá — confira a palavra e tente de novo.';
}
function revealFillBlank(blockId){
  const block = document.getElementById(blockId);
  const answer = decodeURIComponent(block.dataset.answer);
  const fb = document.getElementById(`${blockId}-fb`);
  fb.className = 'drill-feedback show reveal';
  fb.textContent = '💡 Resposta: ' + answer;
}

function loadHomeworkSection(l){
  if(!l) return;
  if(currentRole==='student'){
    apiFetch('/homework_get.php?classKey=' + encodeURIComponent(String(l.id))).then(function(data){
      const subs = data.submissions || [];
      const found = subs.find(function(s){ return s.etapaNum===hwStage; }) || null;
      renderHwFeedbackBanner(l.id, found);
    }).catch(function(){});
  }else if(currentRole==='teacher' && reviewStudentId){
    apiFetch('/homework_get.php?studentId=' + encodeURIComponent(reviewStudentId) + '&classKey=' + encodeURIComponent(String(l.id))).then(function(data){
      const subs = data.submissions || [];
      const found = subs.find(function(s){ return s.etapaNum===hwReviewStage; }) || null;
      renderTeacherReview(l, found, hwReviewStage);
    }).catch(function(){});
  }
}
function collectStageAnswers(lessonId, stageNum, stage){
  if(stage.type==='build'){
    const built = [];
    stage.items.forEach(function(item, i){
      const slot = document.getElementById(`hw-${lessonId}-${i}-slot`);
      const words = slot ? Array.from(slot.children).map(c=>c.textContent) : [];
      const correct = words.length===item.tokens.length && words.every((w,idx)=>w===item.tokens[idx]);
      built.push({pt:item.pt, built:words, correct:correct});
    });
    return {type:'build', items: built};
  }
  if(stage.type==='fillblank'){
    const items = stage.items.map(function(item,i){
      const input = document.getElementById(`hw-${lessonId}-${i}-input`);
      const val = input ? input.value : '';
      return {pt:item.pt, given:val, correct: answerMatches(val, item.answer)};
    });
    return {type:'fillblank', items: items};
  }
  const translate = stage.translate.map(function(it,i){
    const input = document.getElementById(`hw-${lessonId}-tr-input-${i}`);
    const val = input ? input.value : '';
    return {q:it.q, given:val, correct: answerMatches(val, it.a)};
  });
  const matchBox = document.getElementById(`hw-${lessonId}-match`);
  const shuffledPt = matchBox ? JSON.parse(decodeURIComponent(matchBox.dataset.shuffled)) : [];
  const match = stage.match.map(function(p,i){
    const sel = document.getElementById(`hw-${lessonId}-match-sel-${i}`);
    const idx = sel && sel.value!=='' ? parseInt(sel.value,10) : -1;
    const givenPt = idx>=0 ? shuffledPt[idx] : '';
    return {term:p.term, given:givenPt, correct: givenPt===p.pt};
  });
  const fill = stage.fill.map(function(it,i){
    const input = document.getElementById(`hw-${lessonId}-fill-input-${i}`);
    const val = input ? input.value : '';
    return {q:it.q, given:val, correct: answerMatches(val, it.a)};
  });
  return {type:'grammar', translate:translate, match:match, fill:fill};
}
function submitHomeworkStage(lessonId, stageNum){
  const l = allLessonsFlat().find(x=>x.id===lessonId);
  const stages = buildHomeworkStages(l);
  const answers = collectStageAnswers(lessonId, stageNum, stages[stageNum]);
  apiFetch('/homework_submit.php', {method:'POST', body: JSON.stringify({classKey:String(lessonId), etapaNum:stageNum, answers:answers})})
    .then(function(){
      clearHwDraft(lessonId, stageNum);
      showToast('✅ Etapa enviada ao professor.');
      loadHomeworkSection(l);
    }).catch(function(e){ showToast(e.message||'Erro ao enviar tarefa'); });
}
function renderHwFeedbackBanner(lessonId, submission){
  const box = document.getElementById('hwFeedbackBox-'+lessonId);
  if(!box) return;
  if(!submission){ box.innerHTML = ''; return; }
  if(submission.reviewedAt){
    box.innerHTML = `<div class="hw-feedback-banner"><b>✅ Corrigido pelo professor</b><br>${submission.feedback?esc(submission.feedback):'Sem comentários adicionais.'}</div>`;
  }else{
    box.innerHTML = `<div class="hw-feedback-banner pending">📨 Etapa enviada — aguardando correção do professor.</div>`;
  }
}
function renderTeacherReview(l, submission, stageNum){
  const box = document.getElementById('teacherReviewBox-'+l.id);
  if(!box) return;
  if(!submission){
    box.innerHTML = '<div style="color:var(--muted);font-size:12.5px;">Este aluno ainda não enviou esta etapa.</div>';
    return;
  }
  const a = submission.answers || {};
  let rows = '';
  if(a.type==='build'){
    rows = (a.items||[]).map(x=>`<div class="review-card"><div class="a-line"><b>${esc(x.pt)}</b></div><div class="a-line">${x.correct?'✅':'❌'} ${esc((x.built||[]).join(' '))}</div></div>`).join('');
  }else if(a.type==='fillblank'){
    rows = (a.items||[]).map(x=>`<div class="review-card"><div class="a-line"><b>${esc(x.pt)}</b></div><div class="a-line">${x.correct?'✅':'❌'} ${esc(x.given||'(vazio)')}</div></div>`).join('');
  }else if(a.type==='grammar'){
    const trRows = (a.translate||[]).map(x=>`<div class="review-card"><div class="a-line"><b>${esc(x.q)}</b></div><div class="a-line">${x.correct?'✅':'❌'} ${esc(x.given||'(vazio)')}</div></div>`).join('');
    const matchRows = (a.match||[]).map(x=>`<div class="review-card"><div class="a-line"><b>${esc(x.term)}</b></div><div class="a-line">${x.correct?'✅':'❌'} ${esc(x.given||'(vazio)')}</div></div>`).join('');
    const fillRows = (a.fill||[]).map(x=>`<div class="review-card"><div class="a-line"><b>${esc(x.q)}</b></div><div class="a-line">${x.correct?'✅':'❌'} ${esc(x.given||'(vazio)')}</div></div>`).join('');
    rows = `<div class="section-subtitle">A — Tradução</div>${trRows}<div class="section-subtitle">B — Ligar as colunas</div>${matchRows}<div class="section-subtitle">C — Gramática</div>${fillRows}`;
  }
  if(!rows) rows = '<div style="color:var(--muted);font-size:12.5px;">Sem respostas registradas.</div>';
  box.innerHTML = `
    ${rows}
    <div class="panel-field">
      <label>Feedback para o aluno</label>
      <textarea id="teacherFeedbackInput-${l.id}">${esc(submission.feedback||'')}</textarea>
    </div>
    <div class="actions" style="display:flex;gap:8px;flex-wrap:wrap;">
      <button onclick="saveHomeworkFeedback(${l.id}, ${stageNum})">Salvar correção</button>
      <button class="danger" onclick="resetHomeworkSubmission(${l.id}, ${stageNum})">Resetar etapa</button>
    </div>`;
}
function saveHomeworkFeedback(lessonId, stageNum){

  apiFetch('/homework_feedback.php', {method:'POST', body: JSON.stringify({studentId:reviewStudentId, classKey:String(lessonId), etapaNum:stageNum, feedback:feedback})})

  apiFetch('/homework_reset.php', {method:'POST', body: JSON.stringify({studentId:reviewStudentId, classKey:String(lessonId), etapaNum:stageNum})})
    .then(function(){
      showToast('✅ Etapa resetada.');
      loadPendingReviews();
      loadHomeworkSection(allLessonsFlat().find(x=>x.id===lessonId));

}

function downloadHomeworkPDF(lessonId, stageNum){
  const l = allLessonsFlat().find(x=>x.id===lessonId);
  const stages = buildHomeworkStages(l);
  const stage = stages[stageNum];
  const nameInput = document.getElementById(`reviewStudentName-${lessonId}`);
  const name = (nameInput && nameInput.value.trim()) || '_______________________';
  let rows = '';
  if(stage.type==='build'){
    stage.items.forEach((item,i)=>{
      const slot = document.getElementById(`hw-${lessonId}-${i}-slot`);
      const built = slot ? Array.from(slot.children).map(c=>c.textContent).join(' ') : '';
      rows += `<div class="print-item"><div class="print-q">${i+1}. ${esc(item.pt)}</div><div class="print-a">${built ? esc(built) : '&nbsp;'}</div></div>`;
    });
  }else if(stage.type==='fillblank'){
    stage.items.forEach((item,i)=>{
      const input = document.getElementById(`hw-${lessonId}-${i}-input`);
      const given = input && input.value ? input.value : '_____';
      rows += `<div class="print-item"><div class="print-q">${i+1}. ${esc(item.pt)}</div><div class="print-a">${esc(item.before)}${esc(given)}${esc(item.after)}</div></div>`;
    });
  }else{
    stage.translate.forEach((it,i)=>{
      const input = document.getElementById(`hw-${lessonId}-tr-input-${i}`);
      rows += `<div class="print-item"><div class="print-q">${i+1}. ${esc(it.q)}</div><div class="print-a">${input&&input.value ? esc(input.value) : '&nbsp;'}</div></div>`;
    });
    const matchBox = document.getElementById(`hw-${lessonId}-match`);
    const shuffledPt = matchBox ? JSON.parse(decodeURIComponent(matchBox.dataset.shuffled)) : [];
    stage.match.forEach((p,i)=>{
      const sel = document.getElementById(`hw-${lessonId}-match-sel-${i}`);
      const idx = sel && sel.value!=='' ? parseInt(sel.value,10) : -1;
      const given = idx>=0 ? shuffledPt[idx] : '';
      rows += `<div class="print-item"><div class="print-q">${esc(p.term)}</div><div class="print-a">${given ? esc(given) : '&nbsp;'}</div></div>`;
    });
    stage.fill.forEach((it,i)=>{
      const input = document.getElementById(`hw-${lessonId}-fill-input-${i}`);
      rows += `<div class="print-item"><div class="print-q">${esc(it.q)}</div><div class="print-a">${input&&input.value ? esc(input.value) : '&nbsp;'}</div></div>`;
    });
  }
  const dateStr = new Date().toLocaleDateString('pt-BR');
  document.getElementById('printArea').innerHTML = `
    <div class="print-header">
      <h1>English for Lawyers — Homework</h1>
      <p>Aula: ${esc(l.level+' · '+l.title)} &nbsp;·&nbsp; Etapa: ${esc(stage.label)} &nbsp;·&nbsp; Aluno: ${esc(name)} &nbsp;·&nbsp; Data: ${dateStr} &nbsp;·&nbsp; Upfront Idiomas</p>
    </div>
    ${rows}`;
  window.print();
}

/* ---- sentence-building drills (vocab_drills / expr_drills) ---- */
function shuffleTokens(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  if(a.length>1 && a.join(' ')===arr.join(' ')) [a[0],a[1]]=[a[1],a[0]];
  return a;
}
function renderDrillBuilder(domId, pt, tokens){
  const shuffled = shuffleTokens(tokens);
  return `<div class="drill-block" id="${domId}">
    <div class="drill-pt">🗣️ <span class="drill-pt-label">Professor fala:</span> <b>"${esc(pt)}"</b></div>
    <div class="answer-slot" id="${domId}-slot" data-answer="${encodeURIComponent(JSON.stringify(tokens))}"></div>
    <div class="chip-bank" id="${domId}-bank">${shuffled.map(t=>`<button type="button" class="chip" onclick="chipClick('${domId}',this)">${esc(t)}</button>`).join('')}</div>
    <div class="drill-actions">
      <button type="button" class="drill-btn" onclick="checkDrill('${domId}')">Verificar ✓</button>
      <button type="button" class="drill-btn ghost" onclick="resetDrill('${domId}')">Reiniciar ↺</button>
      <button type="button" class="drill-btn ghost" onclick="revealDrill('${domId}')">Ver resposta 👁</button>
    </div>
    <div class="drill-feedback" id="${domId}-fb"></div>
  </div>`;
}
function chipClick(domId, btn){
  const slot = document.getElementById(`${domId}-slot`);
  btn.disabled = true;
  btn.classList.add('used');
  const placed = document.createElement('button');
  placed.type = 'button';
  placed.className = 'chip placed';
  placed.textContent = btn.textContent;
  placed.onclick = function(){
    slot.removeChild(placed);
    btn.disabled = false;
    btn.classList.remove('used');
    saveHwDraftFromDomId(domId);
  };
  slot.appendChild(placed);
  saveHwDraftFromDomId(domId);
}
function checkDrill(domId){
  const slot = document.getElementById(`${domId}-slot`);
  const fb = document.getElementById(`${domId}-fb`);
  const answer = JSON.parse(decodeURIComponent(slot.dataset.answer));
  const built = Array.from(slot.children).map(c=>c.textContent);
  const correct = built.length===answer.length && built.every((w,i)=>w===answer[i]);
  fb.className = 'drill-feedback show ' + (correct?'ok':'no');
  fb.textContent = correct ? '✅ Certinho! Muito bem.' : '❌ Quase lá — confira a ordem e tente de novo.';
}
function resetDrill(domId){
  const slot = document.getElementById(`${domId}-slot`);
  const bank = document.getElementById(`${domId}-bank`);
  slot.innerHTML = '';
  bank.querySelectorAll('.chip').forEach(c=>{ c.disabled=false; c.classList.remove('used'); });
  const fb = document.getElementById(`${domId}-fb`); fb.className='drill-feedback'; fb.textContent='';
  saveHwDraftFromDomId(domId);
}
function revealDrill(domId){
  const slot = document.getElementById(`${domId}-slot`);
  const answer = JSON.parse(decodeURIComponent(slot.dataset.answer));
  const fb = document.getElementById(`${domId}-fb`);
  fb.className = 'drill-feedback show reveal';
  fb.textContent = '💡 Resposta: ' + answer.join(' ');
}

function renderDrillsSection(items, idPrefix, id){
  return items.map((d,i)=>renderDrillBuilder(`drill-${id}-${idPrefix}-${i}`, d.pt, d.tokens)).join('');
}

/* ---- generic radio-button quiz (used for dialogue_mcq / listening_mcq / mcq) ---- */
function stateMapFor(kind){ return {mcq:mcqState, dmcq:dmcqState, listen:listenState}[kind]; }
function stateFor(kind, lessonId){
  const map = stateMapFor(kind);
  if(!map[lessonId]) map[lessonId] = {answered:{}};
  return map[lessonId];
}
function fieldFor(kind){ return {mcq:'mcq', dmcq:'dialogue_mcq', listen:'listening_mcq'}[kind]; }
function renderRadioQuiz(items, kind, id){
  return items.map((q,qi)=>{
    const optsHtml = q.options.map((o,oi)=>`<button class="quiz-opt" onclick="answerRadio('${kind}',${id},${qi},${oi},${q.correct})">${esc(o)}</button>`).join('');
    return `<div class="quiz-card">
      <div class="quiz-q">${qi+1}. ${esc(q.q)}</div>
      <div class="quiz-opts" id="${kind}-opts-${id}-${qi}">${optsHtml}</div>
    </div>`;
  }).join('');
}
function answerRadio(kind, lessonId, qIdx, chosenIdx, correctIdx){
  const st = stateFor(kind, lessonId);
  if(st.answered[qIdx] !== undefined) return;
  st.answered[qIdx] = chosenIdx;
  paintRadio(kind, lessonId, qIdx, chosenIdx, correctIdx);
  updateRadioScore(kind, lessonId);
}
function paintRadio(kind, lessonId, qIdx, chosenIdx, correctIdx){
  const wrap = document.getElementById(`${kind}-opts-${lessonId}-${qIdx}`);
  if(!wrap) return;
  const btns = wrap.querySelectorAll('.quiz-opt');
  btns.forEach((b,i)=>{
    b.classList.add('disabled');
    if(i===correctIdx) b.classList.add('correct');
    else if(i===chosenIdx) b.classList.add('wrong');
  });
}
function updateRadioScore(kind, lessonId){
  const l = allLessonsFlat().find(x=>x.id===lessonId);
  const items = l[fieldFor(kind)];
  const st = stateFor(kind, lessonId);
  let correct = 0;
  Object.keys(st.answered).forEach(qi=>{ if(st.answered[qi]===items[qi].correct) correct++; });
  const el = document.getElementById(`${kind}-score-${lessonId}`);
  if(el) el.textContent = `${correct} / ${items.length}`;
}
function repaintRadioQuiz(kind, lessonId){
  const l = allLessonsFlat().find(x=>x.id===lessonId);
  const items = l[fieldFor(kind)];
  const st = stateFor(kind, lessonId);
  Object.keys(st.answered).forEach(qi=>{
    paintRadio(kind, lessonId, parseInt(qi), st.answered[qi], items[qi].correct);
  });
  updateRadioScore(kind, lessonId);
}

/* ---- written exercises: fill-in-the-blank / translation ---- */
function renderExItems(items, kind, id){
  return items.map((it,i)=>`
    <div class="ex-item">
      <div class="ex-q">${i+1}. ${esc(it.q)}</div>
      <div class="ex-row">
        <input type="text" class="ex-input" id="${kind}-input-${id}-${i}" placeholder="${kind==='translate'?'Type the translation in English':'Digite sua resposta'}" onkeydown="if(event.key==='Enter'){event.preventDefault();checkExItem(${id},'${kind}',${i});}">
        <button type="button" class="drill-btn" onclick="checkExItem(${id},'${kind}',${i})">Verificar</button>
      </div>
      <div class="ex-feedback" id="${kind}-fb-${id}-${i}"></div>
    </div>`).join('');
}
function checkExItem(lessonId, kind, idx){
  const l = allLessonsFlat().find(x=>x.id===lessonId);
  const correctAnswer = l[kind][idx].a;
  const input = document.getElementById(`${kind}-input-${lessonId}-${idx}`);
  const fb = document.getElementById(`${kind}-fb-${lessonId}-${idx}`);
  const ok = normalize(input.value) === normalize(correctAnswer);
  input.classList.remove('correct','incorrect');
  input.classList.add(ok?'correct':'incorrect');
  fb.className = 'ex-feedback show ' + (ok?'ok':'no');
  fb.textContent = ok ? '✅ Correto!' : `❌ Resposta esperada: "${correctAnswer}"`;
  if(!exState[lessonId]) exState[lessonId] = {fill:{}, translate:{}};
  exState[lessonId][kind][idx] = ok;
  updateExScore(lessonId, kind);
}
function updateExScore(lessonId, kind){
  const l = allLessonsFlat().find(x=>x.id===lessonId);
  const total = l[kind].length;
  const st = (exState[lessonId] && exState[lessonId][kind]) || {};
  const correct = Object.values(st).filter(Boolean).length;
  const el = document.getElementById(`${kind}-score-${lessonId}`);
  if(el) el.textContent = `${correct} / ${total}`;
}

  repaintRadioQuiz('dmcq', id);
  repaintRadioQuiz('listen', id);
  repaintRadioQuiz('mcq', id);

  const est = exState[id];
  if(est){
    ['fill','translate'].forEach(kind=>{
      Object.keys(est[kind]||{}).forEach(i=>{
        const input = document.getElementById(`${kind}-input-${id}-${i}`);
        if(input){
          input.classList.add(est[kind][i] ? 'correct' : 'incorrect');
        }
      });
      updateExScore(id, kind);
    });
  }

  loadHomeworkSection(l);
  applyHwDraft(l.id, hwStage);
}

function markComplete(id){
  completed.add(id);
  apiFetch('/progress_complete.php', {method:'POST', body: JSON.stringify({classKey:String(id)})}).catch(function(){});
  renderSidebar();
  showToast('🎉 Aula concluída! Bom trabalho.');
}

function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>el.classList.remove('show'), 2600);
}

/* ================= INIT ================= */
checkSession();
